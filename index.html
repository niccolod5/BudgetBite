<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BudgetBite">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f4c4a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>BudgetBite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app mobile a una colonna. Barra superiore fissa (logo + opzioni), tab bar in basso, fogli che salgono dal basso. */
:root{
  --bg:#eef3f2; --surface:#ffffff; --sunk:#e1eae8; --fg:#0f2726; --muted:#56706d; --line:#cfdcd9;
  --accent:#0f6e67; --accent-soft:#d3ebe7; --on-accent:#ffffff;
  --coin:#e9a325; --coin-deep:#b97a0c; --coin-soft:#fbecc9;
  --home:#6a5bd1; --home-soft:#e6e2fa;
  --warn:#c98a10; --bad:#cf3f2b; --bad-soft:#fbe3df;
  --brand:#0f4c4a; --on-brand:#eaf6f4; --brand-muted:#a9cdc8;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",-apple-system,system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1615; --surface:#13211f; --sunk:#1b2c2a; --fg:#e4f0ee; --muted:#8fa9a5; --line:#253a37;
  --accent:#4cc3b5; --accent-soft:#163633; --on-accent:#05211e;
  --coin:#f5bd4f; --coin-deep:#f0b23c; --coin-soft:#3a2e14;
  --home:#a99cf5; --home-soft:#262245;
  --warn:#eab04a; --bad:#f0806d; --bad-soft:#3b1d18;
  --brand:#114a47; --on-brand:#eaf6f4; --brand-muted:#a9cdc8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1615; --surface:#13211f; --sunk:#1b2c2a; --fg:#e4f0ee; --muted:#8fa9a5; --line:#253a37;
  --accent:#4cc3b5; --accent-soft:#163633; --on-accent:#05211e;
  --coin:#f5bd4f; --coin-deep:#f0b23c; --coin-soft:#3a2e14;
  --home:#a99cf5; --home-soft:#262245;
  --warn:#eab04a; --bad:#f0806d; --bad-soft:#3b1d18;
  --brand:#114a47; --on-brand:#eaf6f4; --brand-muted:#a9cdc8; color-scheme:dark}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{background:var(--bg);height:100%;overflow:hidden;overscroll-behavior:none}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,label,textarea{touch-action:manipulation}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.85rem;font-weight:800;line-height:1.1}
h2{font-size:1.15rem;font-weight:800;line-height:1.2}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.hint{font-size:.82rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;width:100%;min-width:0;display:block}
input,select{height:50px;padding:0 14px;-webkit-appearance:none;appearance:none}
textarea{padding:10px 12px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 22px,calc(100% - 13px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;text-overflow:ellipsis}
input[type=date]{text-align:left;line-height:50px}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
input[type=checkbox]{width:24px;height:24px;padding:0;flex:none;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--accent)}
input::placeholder{color:var(--muted);opacity:.8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- layout ---------- */
/* Guscio a schermo intero: la pagina non scorre, scorre solo il contenuto. Così su iPhone barra e tab restano sempre al loro posto. */
.shell{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
#bar{flex:none}
.stage{flex:1;min-height:0;position:relative}
.scroller{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dock{flex:none;background:var(--bg);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.dock .btn{display:flex;width:100%;max-width:528px;margin:0 auto;min-height:52px}
.appbar{background:var(--bg)}
.appbar .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px;min-height:64px}
.appbar svg.logo{width:34px;height:34px;flex:none;border-radius:9px}
.brandname{font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:-.02em;flex:1}
.brandname em{font-style:normal;color:var(--coin-deep)}
.apptitle{font-family:var(--display);font-weight:800;font-size:1.1rem;flex:1;text-align:center}
.appbar .spacer{width:96px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--fg);background:var(--sunk);flex:none}
.iconbtn svg{width:22px;height:22px}
.backbtn{display:inline-flex;align-items:center;gap:2px;min-height:44px;width:96px;padding:0 12px 0 6px;border-radius:14px;background:var(--sunk);font-weight:700;flex:none}
.backbtn svg{width:22px;height:22px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 32px}
.pagehead{margin:4px 0 16px;display:grid;gap:4px}
.pagehead p{color:var(--muted);font-size:.92rem}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:28px 0 10px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.form{display:grid;gap:12px}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:600}
.mt{margin-top:14px}

/* ---------- controls ---------- */
.btn{background:var(--accent);color:var(--on-accent);border-radius:14px;min-height:50px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.2}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;border-radius:12px;font-size:.9rem}
.btn:disabled{opacity:.5}
.btn:active,.iconbtn:active,.add:active,.ck:active,.rowbtn:active{transform:scale(.98)}
.link{color:var(--accent);font-weight:700;min-height:40px;padding:0 4px}
.link.danger{color:var(--bad)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:42px;border-radius:11px;font-weight:700;font-size:.88rem;color:var(--muted);padding:4px 6px;text-align:center;line-height:1.15}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.checkrow{display:flex;align-items:center;gap:12px;min-height:44px;font-weight:600}
.x{width:40px;height:40px;border-radius:12px;color:var(--muted);flex:none;display:grid;place-items:center;font-size:1rem;line-height:1}
.x:active{background:var(--sunk)}
.chev{color:var(--muted);flex:none;width:18px;height:18px}
.chip{display:inline-block;font-size:.7rem;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);letter-spacing:.02em;white-space:nowrap}
.chip.home{background:var(--home-soft);color:var(--home)}
.chip.coin{background:var(--coin-soft);color:var(--coin-deep)}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}

/* ---------- budget hero ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:12px}
.hero.brand{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.hero.brand .label,.hero.brand .muted{color:var(--brand-muted)}
.hero .figs{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.hero .big{font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.hero .side{text-align:right;font-size:.85rem}
.hero .note{font-size:.82rem}
.over{color:var(--bad)!important}
.hero.brand .over{color:#ffb3a6!important}
.sbar{display:flex;height:12px;background:var(--sunk);border-radius:99px;overflow:hidden;gap:2px}
.hero.brand .sbar{background:rgba(255,255,255,.14)}
.sbar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.sbar .f{background:var(--accent)} .sbar .e{background:var(--coin)}
.hero.brand .sbar .f{background:#5fd3c4}
.sbar.warn i{background:var(--warn)!important} .sbar.bad i{background:var(--bad)!important}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem}
.legend b{font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dot.f{background:var(--accent)} .dot.e{background:var(--coin)}
.hero.brand .dot.f{background:#5fd3c4}

/* ---------- week ---------- */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 14px}
.weeknav .mid{text-align:center;min-width:0;display:grid;justify-items:center;gap:2px}
.weeknav .mid .link{min-height:28px;font-size:.82rem}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 6px;margin-bottom:10px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day.past{opacity:.8}
.dhead{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.dname{font-family:var(--display);font-weight:800;font-size:1.05rem}
.slot{display:grid;grid-template-columns:58px minmax(0,1fr) 40px;gap:8px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.slot>.label{padding-top:11px}
.meals{display:grid;gap:6px;min-width:0}
.meal{background:var(--accent-soft);border-radius:12px;display:flex;align-items:center;min-height:40px}
.meal .mt-btn{flex:1;min-width:0;padding:8px 4px 8px 10px;font-size:.92rem;display:grid;gap:1px}
.meal .mt-btn b{font-weight:700;overflow-wrap:anywhere}
.meal .mt-btn span{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.meal .x{width:36px;height:36px}
.none{color:var(--muted);padding-top:9px}
.add{width:40px;height:40px;border-radius:12px;background:var(--sunk);color:var(--accent);display:grid;place-items:center}
.add svg{width:20px;height:20px}

/* ---------- pantry ---------- */
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 6px;display:grid;gap:8px}
.item .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .h b{font-weight:700;overflow-wrap:anywhere;min-width:0}
.item .h .q{flex:none}
.item.done .h b{color:var(--muted)}
.ibar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.ibar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.uses{font-size:.8rem;color:var(--muted)}
.actions{display:flex;justify-content:flex-end;gap:4px;flex-wrap:wrap;margin-top:-4px}

/* ---------- list ---------- */
.li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);min-height:56px}
.li .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.li .nm span{color:var(--muted);font-size:.85rem;margin-left:6px;font-weight:400}
.li.on .nm{color:var(--muted);text-decoration:line-through}
.ck{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:var(--on-accent);background:var(--surface)}
.ck svg{width:20px;height:20px}
.li.on .ck{background:var(--accent);border-color:var(--accent)}

/* ---------- money rows ---------- */
.rowbtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 2px;border-bottom:1px solid var(--line);min-height:60px}
.rowbtn .l{flex:1;min-width:0;display:grid;gap:2px}
.rowbtn .l b{font-weight:700;overflow-wrap:anywhere}
.rowbtn .amt{font-weight:700;flex:none}

/* ---------- analytics ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:4px;align-content:start;min-width:0}
.tile .v{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.1;letter-spacing:-.02em}
.tile .s{font-size:.78rem;color:var(--muted)}
.tile.wide{grid-column:1/-1}
.good{color:var(--accent)} .badc{color:var(--bad)}
.pill{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)} .pill.no{background:var(--bad-soft);color:var(--bad)} .pill.mid{background:var(--coin-soft);color:var(--coin-deep)}
.pace{display:grid;gap:14px}
.pace .r{display:grid;gap:6px}
.pace .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chart{position:relative;height:150px;display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;margin-top:22px}
.chart .col{height:100%;display:flex;flex-direction:column-reverse;gap:2px;min-width:0}
.chart .col i{display:block;border-radius:5px;width:100%}
.chart .col i.f{background:var(--accent)} .chart .col i.e{background:var(--coin)}
.chart .col.cur i{opacity:.5}
.chart .bl{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);pointer-events:none}
.chart .bl span{position:absolute;right:0;bottom:4px;font-size:.7rem;color:var(--muted);background:var(--surface);padding:0 4px;border-radius:4px}
.xl{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;font-size:.66rem;color:var(--muted);text-align:center;margin-top:6px}
.tablewrap{overflow-x:auto}
.mtab{width:100%;border-collapse:collapse;font-size:.88rem}
.mtab th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:right;padding:0 0 8px 8px;white-space:nowrap}
.mtab th:first-child,.mtab td:first-child{text-align:left;padding-left:0}
.mtab td{text-align:right;padding:9px 0 9px 8px;border-top:1px solid var(--line);white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:.9rem}
.hbar .b{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-bottom:8px}
.hbar .b i{display:block;height:100%;background:var(--coin);border-radius:99px}
.piggy .big{font-family:var(--display);font-size:2rem;font-weight:800;line-height:1;letter-spacing:-.02em}

/* ---------- settings ---------- */
.opt{display:grid;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
.opt:first-child{border-top:0;padding-top:0}
.opt:last-child{padding-bottom:0}
.opt .t{font-weight:700}
.favrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.favrow:first-of-type{border-top:0}
.favrow .nm{flex:1;min-width:0;display:grid}
.favrow .nm span{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}

/* ---------- tab bar ---------- */
.tabs{flex:none;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:560px}
.tabs button{min-height:54px;padding:6px 0;border-radius:14px;font-weight:700;font-size:.64rem;letter-spacing:-.01em;color:var(--muted);display:grid;justify-items:center;align-content:center;gap:3px;text-align:center}
.tabs button svg{width:24px;height:24px;padding:2px 8px;box-sizing:content-box;margin:-2px 0;border-radius:10px}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs button[aria-selected="true"] svg{background:var(--accent-soft)}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,20,19,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:24px 24px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:-4px auto 2px}
.sheet .head{display:grid;gap:4px}
.ingr{display:grid;grid-template-columns:minmax(0,1fr) 96px 40px;gap:6px;align-items:end}
.ingr .ingleft{grid-column:1/-1;margin-top:-2px}
.pickbtn{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;font-size:16px;text-align:left;min-width:0}
.pickbtn b{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbtn svg{width:18px;height:18px;color:var(--muted);flex:none}
.addingr{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:1.5px dashed var(--line);border-radius:14px;color:var(--accent);font-weight:700}
.addingr svg{width:20px;height:20px}
.pscrim{position:fixed;inset:0;z-index:35;background:rgba(5,20,19,.35);display:flex;align-items:flex-end;justify-content:center}
.picker{background:var(--surface);width:100%;max-width:560px;max-height:75vh;max-height:75dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:up .2s ease-out;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.plist{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pitem{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;min-height:54px;padding:14px 4px;border-bottom:1px solid var(--line)}
.pitem b{font-weight:600;overflow-wrap:anywhere;min-width:0}
.pitem span{color:var(--muted);font-size:.85rem;flex:none}
.pitem.on b{color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;background:var(--coin-soft);color:var(--coin-deep);border-radius:99px;padding:0 2px 0 14px;min-height:38px;font-weight:700;font-size:.9rem}
.tag .x{width:34px;height:34px;color:inherit}
.ingr+.ingr{padding-top:10px;border-top:1px dashed var(--line)}
.favs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.favchip{flex:none;min-height:40px;padding:0 14px;border-radius:99px;background:var(--coin-soft);color:var(--coin-deep);font-weight:700;font-size:.9rem;white-space:nowrap}
.favchip[aria-pressed="true"]{background:var(--coin);color:#3a2700}
.warnbox{background:var(--coin-soft);border-radius:14px;padding:12px 14px;display:grid;gap:8px;font-size:.9rem}
.warnbox ul{margin:0;padding-left:18px}
.warnbox b{color:var(--coin-deep)}
.steps{display:flex;gap:4px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--accent)}
.sum{margin:0;padding-left:18px}.sum li{padding:3px 0}

/* ---------- toast & keyboard ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--toastB,92px);background:var(--fg);color:var(--bg);padding:8px 8px 8px 16px;border-radius:14px;font-size:.9rem;font-weight:600;z-index:45;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;min-height:44px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast span{padding-right:8px}
.toast button{color:var(--coin);font-weight:800;min-height:36px;padding:0 10px;border-radius:10px;flex:none}
.kbdone{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));background:var(--fg);color:var(--bg);border-radius:99px;min-height:40px;padding:0 16px 0 12px;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.kbdone svg{width:18px;height:18px}

const LS_KEY = "spesa-pasti-v1";
const LIST_KEYS = ["items","expenses","meals","list","extras","favs","piggyOut"];
const DEFAULT_BF = ["Arance","Latte","Burro d'arachidi","Marmellata"];
const blankSettings = () => ({theme:"system", lang:"it", units:"metric", weekStart:1, carry:"off", carryFrom:null, breakfast:[...DEFAULT_BF]});
const blank = () => ({v:1, weekly:80, monthly:320, extraWeekly:78, extraMonthly:312,
  items:[], expenses:[], meals:[], list:[], extras:[], favs:[], piggyOut:[], goal:null, settings:blankSettings()});
function normalize(s){
  const o = Object.assign(blank(), s && typeof s==="object" ? s : {});
  o.settings = Object.assign(blankSettings(), (s && s.settings) || {});
  for(const k of LIST_KEYS) if(!Array.isArray(o[k])) o[k] = [];
  if(!Array.isArray(o.settings.breakfast)) o.settings.breakfast = [...DEFAULT_BF];
  // Una volta sola: i prodotti della colazione già in lista o in dispensa passano nella categoria Colazione.
  if(!o.mig || !o.mig.bf1){ markBreakfast(o); o.mig = Object.assign({}, o.mig, {bf1:true}); }
  return o;
}
const normName = s => String(s || "").toLowerCase().replace(/[’‘`´]/g, "'").replace(/\bdi\s+(?=[aeiouàèéìòù])/g, "d'").replace(/\s+/g, " ").trim();
function isBreakfastName(name, list){ const n = normName(name); return (list || []).some(k => { const kk = normName(k); return kk && (n===kk || n.startsWith(kk+" ")); }); }
// Sposta in Colazione i prodotti con quei nomi: in lista sempre, in dispensa solo se non sono già usati nei pasti.
function markBreakfast(o){
  const usedIds = new Set(o.meals.flatMap(m => (m.ing || []).map(g => g.itemId)));
  for(const l of o.list) if((l.cat || "food")==="food" && isBreakfastName(l.name, o.settings.breakfast)) l.cat = "breakfast";
  for(const i of o.items) if((i.cat || "food")==="food" && !usedIds.has(i.id) && isBreakfastName(i.name, o.settings.breakfast)) i.cat = "breakfast";
}

let state = blank();
const ui = {tab:"week", prevTab:"week", weekOffset:0, showDone:false, pantryCat:"food", listCat:null, statsPeriod:"week", restore:false, confirmClear:false};
let dbRef = null, dirty = false, writing = false, saveTimer = null, syncKey = "local";
const T = () => STR[state.settings.lang] || STR.it;

function loadLocal(){ try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const s = JSON.parse(raw); if(s && s.v===1){ state = normalize(s); saveLocal(); } } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function commit(){ saveLocal(); render(); if(dbRef){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500); } }
async function flush(){
  if(!dbRef || writing || !dirty) return;
  writing = true; dirty = false;
  try{ await dbRef.set(JSON.parse(JSON.stringify(state))); syncKey = "synced"; }
  catch(e){ syncKey = e && e.code==="invalid_argument" ? "ro" : "fail"; if(e && e.code==="unavailable"){ dirty = true; setTimeout(flush, 1500 + Math.random()*1000); } }
  writing = false; updateSync(); if(dirty) flush();
}
function updateSync(){ const el = $("#sync"); if(el) el.textContent = T().sync[syncKey]; }
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db"); if(!db) return;
    dbRef = db.doc("planner/state");
    let first = true;
    dbRef.onSnapshot(snap => {
      if(snap.metadata.hasPendingWrites) return;
      if(snap.exists){
        if(!dirty && !writing){ state = normalize(JSON.parse(JSON.stringify(snap.data()))); saveLocal(); applyTheme(); render(); }
        syncKey = "synced";
      } else if(first && LIST_KEYS.some(k => state[k].length)){ dirty = true; flush(); }
      else syncKey = "synced";
      first = false; updateSync();
    }, () => { syncKey = "local"; updateSync(); });
  }catch(e){}
}

   ========================================================= */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).trim().replace(/\s/g,"").replace(",", ".")); return isFinite(n) ? n : NaN; };
const r2 = x => Math.round(x*100)/100;
const eur = n => n.toLocaleString(T().locale, {style:"currency", currency:"EUR"});
const qfmt = n => (Math.round(n*100)/100).toLocaleString(T().locale, {maximumFractionDigits:2});
const moneyIn = n => n.toLocaleString(T().locale, {minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:false});
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayD = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
function sow(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() - state.settings.weekStart + 7) % 7); return x; }
const weekRange = ws => [iso(ws), iso(addDays(ws,6))];
const viewWeek = () => addDays(sow(new Date()), ui.weekOffset*7);
const mon3 = d => T().months[d.getMonth()].slice(0,3);
const dayLong = d => T().days[d.getDay()]+" "+d.getDate()+" "+T().months[d.getMonth()];
const dayShort = d => T().days[d.getDay()].slice(0,3)+" "+d.getDate();
function rangeLabel(ws){ const we = addDays(ws,6); return ws.getDate()+(ws.getMonth()!==we.getMonth() ? " "+mon3(ws) : "")+"–"+we.getDate()+" "+mon3(we); }
function monthBounds(d = new Date()){ return [iso(new Date(d.getFullYear(), d.getMonth(), 1)), iso(new Date(d.getFullYear(), d.getMonth()+1, 0)), T().months[d.getMonth()]]; }
const sameName = (a,b) => a.trim().toLowerCase() === b.trim().toLowerCase();
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;

// Unità: le quantità restano nell'unità del prodotto, la conversione è solo a schermo.
const F = {g:1, kg:1000, oz:28.349523, lb:453.59237, ml:1, l:1000, "fl oz":29.57353, pz:1};
const DIM = {g:"m", kg:"m", oz:"m", lb:"m", ml:"v", l:"v", "fl oz":"v", pz:"c"};
const METRIC = ["g","kg","ml","l","pz"], IMPERIAL = ["oz","lb","fl oz","pz"];
const unitList = () => state.settings.units==="imperial" ? IMPERIAL : METRIC;
const ul = u => u==="pz" ? T().pcs : u==="l" ? "lt" : u;
function dispUnit(u){
  if(state.settings.units==="imperial") return {g:"oz", kg:"lb", ml:"fl oz", l:"fl oz"}[u] || u;
  return {oz:"g", lb:"kg", "fl oz":"ml"}[u] || u;
}
const toDisp = (q, u) => { const d = dispUnit(u); return [q*F[u]/F[d], d]; };
const fromDisp = (q, d, u) => q*F[d]/F[u];
const qs = (q, u) => { if(q==null) return ""; const [a,d] = toDisp(q,u); return qfmt(a)+" "+ul(d); };
// Le porzioni dei pasti si indicano in g o ml (oz o fl oz) anche se il prodotto è in kg o litri.
function mealUnit(u){
  if(state.settings.units==="imperial") return DIM[u]==="m" ? "oz" : DIM[u]==="v" ? "fl oz" : "pz";
  return DIM[u]==="m" ? "g" : DIM[u]==="v" ? "ml" : "pz";
}
const toMeal = (q, u) => q*F[u]/F[mealUnit(u)];
const fromMeal = (v, u) => v*F[mealUnit(u)]/F[u];
const roundMeal = (q, u) => Math.round(toMeal(q,u)*100)/100;
const mqs = (q, u) => qfmt(toMeal(q,u))+" "+ul(mealUnit(u));
// Porzione proposta: 100 g o 100 ml (3,5 oz), 1 pezzo; mai più di quanto resta.
function defaultPortion(it, avail){
  const mu = mealUnit(it.unit), v = mu==="pz" ? 1 : (mu==="g" || mu==="ml") ? 100 : 3.5;
  return Math.min(fromMeal(v, it.unit), avail);
}

const itemById = id => state.items.find(i => i.id===id);
const catOf = i => i.cat==="home" ? "home" : i.cat==="breakfast" ? "breakfast" : "food";
const isHome = i => i.cat==="home";
const isFood = i => catOf(i)==="food";
function used(id, exceptMealId){ let s = 0; for(const m of state.meals) if(m.id!==exceptMealId) for(const g of m.ing) if(g.itemId===id) s += +g.qty || 0; return s; }
function remaining(it, exceptMealId){ if(it.qty==null) return 0; return Math.max(0, Math.round((it.qty - used(it.id, exceptMealId))*10000)/10000); }
const spentShop = (a,b) => state.expenses.filter(e => e.date>=a && e.date<=b).reduce((s,e) => s+e.amount, 0);
const spentExtra = (a,b) => state.extras.filter(e => e.date>=a && e.date<=b).reduce((s,e) => s+e.amount, 0);

function addToList(name, cat, qty, unit){
  if(inList(name)) return false;
  state.list.push({id:uid(), name, qty:qty>0?qty:null, unit:qty>0?unit:null, checked:false, cat:cat||"food"});
  return true;
}

// Budget settimanale effettivo, con l'eventuale riporto dalla settimana prima.
function weekBudget(kind, ws){
  const base = kind==="shop" ? state.weekly : state.extraWeekly;
  const st = state.settings;
  if(st.carry!=="next" || !st.carryFrom) return {base, carry:0, eff:base};
  const start = sow(parseIso(st.carryFrom));
  let eff = base, n = 0;
  for(let w = start; w < ws && n < 520; w = addDays(w,7), n++){
    const [a,b] = weekRange(w);
    eff = base + (eff - (kind==="shop" ? spentShop(a,b) : spentExtra(a,b)));
  }
  return {base, carry:r2(eff-base), eff:r2(eff)};
}
function piggy(){
  const st = state.settings;
  if(st.carry!=="piggy" || !st.carryFrom) return null;
  const start = sow(parseIso(st.carryFrom)), cur = sow(new Date());
  let saved = 0, weeks = 0;
  for(let w = start; w < cur && weeks < 520; w = addDays(w,7), weeks++){
    const [a,b] = weekRange(w);
    saved += (state.weekly - spentShop(a,b)) + (state.extraWeekly - spentExtra(a,b));
  }
  const out = state.piggyOut.reduce((s,x) => s+x.amount, 0);
  return {total:r2(saved-out), weeks};
}

// Testo veloce: "pesce surgelato 300g", "uova x6".
const UMAP = {g:"g",gr:"g",grammi:"g",kg:"kg",chili:"kg",ml:"ml",l:"l",lt:"l",litri:"l",litro:"l",pz:"pz",pezzi:"pz",pezzo:"pz",pcs:"pz",pc:"pz",oz:"oz",once:"oz",oncia:"oz",lb:"lb",lbs:"lb",libbre:"lb",libbra:"lb",floz:"fl oz"};
function parseEntry(txt){
  let t = txt.trim(), qty = null, unit = null;
  let m = t.match(/(?:^|\s)(\d+(?:[.,]\d+)?)\s*(fl\s?oz|kg|grammi|gr|g|ml|litri|litro|lt|l|pezzi|pezzo|pz|pcs|pc|oz|once|oncia|lbs|lb|libbre|libbra)(?=\s|$)/i);
  if(m){ qty = num(m[1]); unit = UMAP[m[2].toLowerCase().replace(/\s/g,"")]; t = t.slice(0,m.index)+" "+t.slice(m.index+m[0].length); }
  else { m = t.match(/(?:^|\s)x\s*(\d+)(?=\s|$)|(?:^|\s)(\d+)\s*x(?=\s|$)/i); if(m){ qty = num(m[1]||m[2]); unit = "pz"; t = t.slice(0,m.index)+" "+t.slice(m.index+m[0].length); } }
  return {name:cap(t.replace(/\s+/g," ").trim()), qty, unit};
}
// "gelato 3,5€" -> {amount:3.5, note:"Gelato"}
function parseExtra(txt){
  const s = txt.trim(), re = /(?:€\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:€|eur(?:o)?\b)?/gi;
  let m, last = null;
  while((m = re.exec(s))) last = {m:m[0], v:num(m[1]), i:m.index};
  if(!last || !(last.v>0)) return null;
  const note = (s.slice(0,last.i)+" "+s.slice(last.i+last.m.length)).replace(/\s+/g," ").trim();
  return {amount:r2(last.v), note:cap(note) || T().extraDefault};
}

// Piatti preferiti.
const findFav = name => name ? state.favs.find(f => sameName(f.name, name)) : null;
function saveFav(name, ing){
  const list = ing.map(g => { const it = itemById(g.itemId); return it ? {name:it.name, qty:Math.round(g.qty*10000)/10000, unit:it.unit} : null; }).filter(Boolean);
  const f = findFav(name);
  if(f){ f.name = name; f.ing = list; } else state.favs.push({id:uid(), name, ing:list});
}
// Abbina gli ingredienti di un preferito alla dispensa: righe pronte e cosa manca.
function planFav(f){
  const rows = [], missing = [];
  for(const g of f.ing){
    const cands = state.items.filter(i => isFood(i) && sameName(i.name, g.name) && remaining(i)>0 && !rows.some(r => r.itemId===i.id));
    const it = cands.find(i => DIM[i.unit]===DIM[g.unit]) || cands[0];
    if(!it){ missing.push({name:g.name, qty:g.qty, unit:g.unit}); continue; }
    const rem = remaining(it);
    if(DIM[it.unit]!==DIM[g.unit]){ rows.push({itemId:it.id, qty:rem}); continue; }
    const need = g.qty*F[g.unit]/F[it.unit];
    if(need <= rem + 1e-9) rows.push({itemId:it.id, qty:need});
    else { rows.push({itemId:it.id, qty:rem}); missing.push({name:g.name, have:rem, unit:it.unit, short:true}); }
  }
  return {rows, missing};
}

function applyTheme(){

  if(th==="system"){ if(hostTheme) r.setAttribute("data-theme", hostTheme); else r.removeAttribute("data-theme"); }
  else r.setAttribute("data-theme", th);
  r.lang = state.settings.lang;
}
let toastTimer;
function toast(msg, opt = {}){
  const root = $("#toastRoot");
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${opt.undo ? `<button type="button" id="toastUndo">${T().undo}</button>` : ""}</div>`;
  if(opt.undo) $("#toastUndo").onclick = () => { clearTimeout(toastTimer); root.innerHTML = ""; opt.undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ""; }, opt.undo ? 6000 : 2600);
}
// Esegue una modifica distruttiva e offre "Annulla" per qualche secondo.
function withUndo(msg, mutate){
  const snap = JSON.stringify(state);
  mutate(); commit();
  toast(msg, {undo(){ state = normalize(JSON.parse(snap)); applyTheme(); commit(); toast(T().tRestored); }});
}

const pagehead = (h, p) => `<div class="pagehead"><h1>${h}</h1>${p ? `<p>${p}</p>` : ""}</div>`;
const catChip = c => c==="home" ? `<span class="chip home">${T().homeShort}</span>` : c==="breakfast" ? `<span class="chip coin">${T().bfShort}</span>` : `<span class="chip">${T().foodShort}</span>`;
const slotLabel = s => s==="pranzo" ? T().lunch : T().dinner;

function hero({title, spent, budget, brand, kind="f", note=""}){
  const t = T(), left = budget - spent, pct = budget>0 ? Math.min(100, spent/budget*100) : 100;
  return `<section class="hero ${brand ? "brand" : ""}">
    <div class="figs"><div><div class="label">${title}</div><div class="big num ${left<0 ? "over" : ""}">${eur(left)}</div></div>
      <div class="side muted num">${t.spentOf(eur(spent), eur(budget))}</div></div>
    <div class="sbar ${spent>budget ? "bad" : pct>=85 ? "warn" : ""}"><i class="${kind}" style="width:${pct}%"></i></div>
    ${note ? `<div class="note muted">${note}</div>` : ""}</section>`;
}
function carryNote(c){ const t = T(); if(!c.carry) return ""; return c.carry>0 ? t.carryPlus(eur(c.carry)) : t.carryMinus(eur(-c.carry)); }

/* ---- Settimana ---- */
function viewWeek_(){
  const t = T(), ws = viewWeek(), today = iso(new Date());
  const tag = ui.weekOffset===0 ? t.thisWeek : ui.weekOffset===1 ? t.nextWeek : ui.weekOffset===-1 ? t.lastWeek : "";
  let h = pagehead(t.tabWeek, t.weekSub);
  h += `<div class="weeknav"><button class="iconbtn" data-act="weekPrev" aria-label="${t.prevWeekA}">${I.back}</button>
    <div class="mid"><h2 class="num">${rangeLabel(ws)}</h2>${ui.weekOffset===0 ? `<span class="small muted">${tag}</span>` : `<button class="link" data-act="weekToday">${tag ? tag+" · " : ""}${t.backToday}</button>`}</div>
    <button class="iconbtn" data-act="weekNext" aria-label="${t.nextWeekA}">${I.fwd}</button></div>`;
  if(!state.items.some(isFood) && !state.meals.length){
    h += `<div class="empty" style="margin-bottom:12px"><b>${t.emptyPantryT}</b><span class="muted small">${t.emptyPantryD}</span>
      <div class="grid2"><button class="btn" data-act="tab" data-tab="pantry">${t.goPantry}</button><button class="btn ghost" data-act="sample">${t.tryExample}</button></div></div>`;
  }
  for(let i = 0; i < 7; i++){
    const d = addDays(ws, i), di = iso(d);
    h += `<div class="day ${di===today ? "today" : di<today ? "past" : ""}"><div class="dhead"><span class="dname">${t.days[d.getDay()]}</span><span class="muted small num">${d.getDate()} ${mon3(d)}</span>${di===today ? `<span class="chip">${t.today}</span>` : ""}</div>`;
    for(const slot of ["pranzo","cena"]){
      const sl = slotLabel(slot), ms = state.meals.filter(m => m.date===di && m.slot===slot);
      h += `<div class="slot"><div class="label">${sl}</div><div class="meals">`;
      if(!ms.length) h += `<div class="none">–</div>`;
      for(const m of ms){
        const ing = m.ing.map(g => { const it = itemById(g.itemId); return it ? esc(it.name)+" "+mqs(+g.qty, it.unit) : t.removedIng; }).join(" · ");
        const first = m.ing[0] && itemById(m.ing[0].itemId);
        const title = m.name || (first ? first.name : t.meal);
        h += `<div class="meal"><button class="mt-btn" data-act="editMeal" data-id="${m.id}"><b>${esc(title)}</b>${ing ? `<span>${ing}</span>` : ""}</button>
          <button class="x" data-act="delMeal" data-id="${m.id}" aria-label="${t.removeMeal} ${esc(title)}">✕</button></div>`;
      }
      h += `</div><button class="add" data-act="addMeal" data-date="${di}" data-slot="${slot}" aria-label="${esc(t.addMealFor(sl, dayLong(d)))}">${I.plus}</button></div>`;
    }
    h += `</div>`;
  }
  return h;
}

  h += `<div class="sechead"><h2>${t.available} <span class="muted num">${avail.length}</span></h2></div>`;

function foodCard(it){

function plainCard(it){

/* ---- Analisi ---- */
function viewStats(){
  const t = T(), now = new Date(), today = todayD(), week = ui.statsPeriod!=="month";
  let a, b, days, elapsed, shopB, extraB, label;
  if(week){
    const ws = sow(now); [a,b] = weekRange(ws); days = 7; elapsed = Math.round((today-ws)/864e5)+1;
    shopB = weekBudget("shop", ws).eff; extraB = weekBudget("extra", ws).eff; label = rangeLabel(ws);
  } else {
    let mName; [a,b,mName] = monthBounds(); days = parseIso(b).getDate(); elapsed = now.getDate();
    shopB = state.monthly; extraB = state.extraMonthly; label = mName;
  }
  const shop = spentShop(a,b), extra = spentExtra(a,b), tot = shop+extra, totB = shopB+extraB, left = totB-tot;
  const scale = Math.max(totB, tot) || 1, rem = days-elapsed, proj = x => x/elapsed*days;
  const pill = (s, bud) => s>bud ? `<span class="pill no">${t.over}</span>` : proj(s)>bud*1.02 ? `<span class="pill mid">${t.atRisk}</span>` : `<span class="pill ok">${t.onTrack}</span>`;
  const pct = (s, bud) => bud>0 ? Math.min(100, s/bud*100) : 100;

  let h = pagehead(t.tabStats, t.statsSub);
  h += `<div class="seg" style="margin-bottom:12px"><button data-act="statsPeriod" data-p="week" aria-pressed="${week}">${t.pWeek}</button><button data-act="statsPeriod" data-p="month" aria-pressed="${!week}">${t.pMonth}</button></div>`;
  h += `<section class="hero brand"><div class="figs"><div><div class="label">${t.totalOut} · ${label}</div><div class="big num">${eur(tot)}</div></div>
      <div class="side muted num">${t.totalBudget(eur(totB))}<br><b class="${left<0 ? "over" : ""}" style="color:var(--on-brand)">${left<0 ? t.overTot(eur(-left)) : t.leftTot(eur(left))}</b></div></div>
    <div class="sbar"><i class="f" style="width:${shop/scale*100}%"></i><i class="e" style="width:${extra/scale*100}%"></i></div>
    <div class="legend num"><span><i class="dot f"></i>${t.shopL} <b>${eur(shop)}</b> / ${eur(shopB)}</span><span><i class="dot e"></i>${t.extraL} <b>${eur(extra)}</b> / ${eur(extraB)}</span></div></section>`;

  // Ritmo
  h += `<div class="sechead"><h2>${t.pace}</h2></div><div class="tiles num">
    <div class="tile"><span class="s">${t.perDay}</span><span class="v">${eur(tot/elapsed)}</span></div>
    <div class="tile"><span class="s">${t.projection}</span><span class="v ${proj(tot)>totB ? "badc" : "good"}">${eur(proj(tot))}</span></div>
    <div class="tile"><span class="s">${t.daysLeft}</span><span class="v">${rem}</span></div>
    <div class="tile"><span class="s">${t.canSpend}</span><span class="v ${left<0 ? "badc" : ""}">${rem>0 ? eur(Math.max(0,left)/rem) : "–"}</span></div></div>
  <div class="card pace num mt">
    <div class="r"><div class="top"><b>${t.shopL}</b>${pill(shop, shopB)}</div><div class="sbar ${shop>shopB ? "bad" : ""}"><i class="f" style="width:${pct(shop,shopB)}%"></i></div><span class="small muted">${t.projOf(eur(proj(shop)), eur(shopB))}</span></div>
    <div class="r"><div class="top"><b>${t.extraL}</b>${pill(extra, extraB)}</div><div class="sbar ${extra>extraB ? "bad" : ""}"><i class="e" style="width:${pct(extra,extraB)}%"></i></div><span class="small muted">${t.projOf(eur(proj(extra)), eur(extraB))}</span></div></div>`;

  // Avanzo: salvadanaio o riporto
  const pg = piggy(), st = state.settings;
  if(pg){
    const g = state.goal, gp = g && g.amount>0 ? Math.max(0, Math.min(100, Math.round(pg.total/g.amount*100))) : null;
    const outs = state.piggyOut.slice().sort((x,y) => y.date.localeCompare(x.date)).slice(0,5);
    h += `<div class="sechead"><h2>${t.piggyT}</h2></div><div class="card piggy" style="display:grid;gap:12px">
      <div class="big num ${pg.total<0 ? "badc" : ""}">${eur(pg.total)}</div><p class="small muted">${t.piggyWeeks(pg.weeks)}</p>
      ${gp!=null ? `<div class="sbar"><i class="e" style="width:${gp}%"></i></div><p class="small">${esc(t.goalProgress(gp, g.name, eur(g.amount)))}</p>` : ""}
      <button class="btn ghost" data-act="piggyOut">${t.useFromPiggy}</button>
      ${outs.length ? `<div><div class="label" style="margin-bottom:4px">${t.withdrawals}</div>${outs.map(o => `<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:4px 0"><span class="small" style="flex:1">${esc(o.note || t.piggyOutDefault)} <span class="muted">· ${dayShort(parseIso(o.date))}</span></span><b class="num small">${eur(o.amount)}</b><button class="x" data-act="delPiggyOut" data-id="${o.id}" aria-label="${t.del}">✕</button></div>`).join("")}</div>` : ""}</div>`;
  } else if(st.carry==="next"){
    const cs = weekBudget("shop", sow(now)).carry, ce = weekBudget("extra", sow(now)).carry, sg = x => (x>0 ? "+" : "") + eur(x);
    h += `<div class="sechead"><h2>${t.carryT}</h2></div><div class="card"><p class="small">${t.carryNow(sg(cs), sg(ce))}</p></div>`;
  } else {
    h += `<div class="sechead"><h2>${t.carryOffT}</h2></div><div class="card" style="display:grid;gap:10px"><p class="small muted">${t.carryOffD}</p><button class="link" style="justify-self:start" data-act="tab" data-tab="settings">${t.goSettings}</button></div>`;
  }

  // Dal primo dato registrato in poi, per non contare periodi in cui l'app non c'era
  const firstDate = [...state.expenses, ...state.extras].reduce((m,e) => e.date<m ? e.date : m, iso(now));
  // Ultime 8 settimane
  const cws = sow(now), wk = [];
  for(let k = 7; k >= 0; k--){ const ws = addDays(cws, -7*k), [x,y] = weekRange(ws); wk.push({ws, s:spentShop(x,y), e:spentExtra(x,y), cur:k===0}); }
  const wB = state.weekly + state.extraWeekly, wMax = Math.max(wB, ...wk.map(w => w.s+w.e))*1.08 || 1;
  const past = wk.filter(w => !w.cur && iso(addDays(w.ws,6))>=firstDate), okW = past.filter(w => w.s+w.e <= wB).length;
  h += `<div class="sechead"><h2>${t.last8}</h2></div><div class="card num">
    <div class="chart" role="img" aria-label="${t.last8}">${wk.map(w => `<div class="col ${w.cur ? "cur" : ""}" title="${rangeLabel(w.ws)} · ${eur(w.s+w.e)}"><i class="f" style="height:${w.s/wMax*100}%"></i><i class="e" style="height:${w.e/wMax*100}%"></i></div>`).join("")}
      <div class="bl" style="bottom:${wB/wMax*100}%"><span>${t.budgetLine} ${eur(wB)}</span></div></div>
    <div class="xl">${wk.map(w => `<span>${w.ws.getDate()}/${w.ws.getMonth()+1}</span>`).join("")}</div>
    <div class="legend muted" style="margin-top:10px"><span><i class="dot f"></i>${t.shopL}</span><span><i class="dot e"></i>${t.extraL}</span></div>
    <p class="small muted" style="margin-top:8px">${past.length ? t.inBudget(okW, past.length)+" " : ""}${t.curWeekNote}${st.carry==="next" ? " "+t.baseBudgetNote : ""}</p></div>`;

  // Ultimi 6 mesi
  const rows = [];
  for(let k = 5; k >= 0; k--){
    const d = new Date(now.getFullYear(), now.getMonth()-k, 1), [x,y] = monthBounds(d);
    if(y < firstDate) continue;
    const s = spentShop(x,y), e = spentExtra(x,y), diff = state.monthly + state.extraMonthly - s - e;
    rows.push(`<tr><td>${mon3(d)} ${String(d.getFullYear()).slice(2)}</td><td>${eur(s)}</td><td>${eur(e)}</td><td class="${diff<0 ? "badc" : "good"}"><b>${diff>=0 ? "+" : ""}${eur(diff)}</b></td></tr>`);
  }
  h += `<div class="sechead"><h2>${t.last6}</h2></div><div class="card tablewrap"><table class="mtab num"><thead><tr><th>${t.colMonth}</th><th>${t.colShop}</th><th>${t.colExtra}</th><th>${t.colDiff}</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;

  // Extra per categoria e voci principali
  const ex = state.extras.filter(e => e.date>=a && e.date<=b), byCat = {}, byNote = {};
  for(const e of ex){
    const c = xcatOf(e); byCat[c] = (byCat[c]||0) + e.amount;
    const k = e.note.trim().toLowerCase(); byNote[k] = byNote[k] || {n:e.note, v:0, c:0}; byNote[k].v += e.amount; byNote[k].c++;
  }
  const cats = Object.entries(byCat).sort((x,y) => y[1]-x[1]), cMax = cats.length ? cats[0][1] : 1;
  const top = Object.values(byNote).sort((x,y) => y.v-x.v).slice(0,5), tMax = top.length ? top[0].v : 1;
  h += `<div class="sechead"><h2>${t.extraByCat}</h2></div><div class="card">${cats.length
    ? `<div class="hbar num">${cats.map(([c,v]) => `<span>${t.xcat[c]} <span class="muted small">${Math.round(v/extra*100)}%</span></span><b>${eur(v)}</b><div class="b"><i style="width:${v/cMax*100}%"></i></div>`).join("")}</div>`
    : `<p class="small muted">${t.noExtraP}</p>`}</div>`;
  if(top.length) h += `<div class="sechead"><h2>${t.topExtra}</h2></div><div class="card"><div class="hbar num">${top.map(g => `<span>${esc(g.n)}${g.c>1 ? ` <span class="muted small">×${g.c}</span>` : ""}</span><b>${eur(g.v)}</b><div class="b"><i style="width:${g.v/tMax*100}%"></i></div>`).join("")}</div></div>`;

  // Spese al supermercato
  const sx = state.expenses.filter(e => e.date>=a && e.date<=b);
  h += `<div class="sechead"><h2>${t.shopStats}</h2></div><div class="tiles num">
    <div class="tile"><span class="s">${t.trips}</span><span class="v">${sx.length}</span></div>
    <div class="tile"><span class="s">${t.avgTrip}</span><span class="v">${sx.length ? eur(shop/sx.length) : "–"}</span></div>
    <div class="tile wide"><span class="s">${t.maxTrip}</span><span class="v">${sx.length ? eur(Math.max(...sx.map(e => e.amount))) : "–"}</span></div></div>`;

  // Cucina e dispensa
  const [wa, wb] = weekRange(sow(now));
  const slots = new Set(state.meals.filter(m => m.date>=wa && m.date<=wb).map(m => m.date+m.slot)).size;
  const added = state.items.filter(i => { const d = (i.added||"").slice(0,10); return d>=a && d<=b; });
  h += `<div class="sechead"><h2>${t.kitchen}</h2></div><div class="tiles num">
    <div class="tile"><span class="s">${t.mealsPlanned}</span><span class="v">${slots} <span class="s">${t.ofN(14)}</span></span></div>
    <div class="tile"><span class="s">${t.inPantryNow}</span><span class="v">${state.items.filter(i => isFood(i) && remaining(i)>0).length}</span></div>
    <div class="tile"><span class="s">${t.boughtFood}</span><span class="v">${added.filter(i => !isHome(i)).length}</span></div>
    <div class="tile"><span class="s">${t.boughtHome}</span><span class="v">${added.filter(isHome).length}</span></div>
    <div class="tile wide"><span class="s">${t.favCount}</span><span class="v">${state.favs.length}</span></div></div>`;
  return h;
}

  h += `<div class="card mt" style="display:grid;gap:10px"><div class="t" style="font-weight:700">${t.sBf}</div><p class="hint">${t.sBfD}</p>
    <div class="tags">${s.breakfast.map((b,i) => `<span class="tag">${esc(b)}<button type="button" class="x" data-act="delBf" data-i="${i}" aria-label="${t.del} ${esc(b)}">✕</button></span>`).join("") || `<p class="small muted">${t.noBf}</p>`}</div>
    <form class="row" id="bfForm" autocomplete="off"><input id="bfIn" placeholder="${t.phBfAdd}" aria-label="${t.sBf}"><button class="btn" type="submit" style="flex:none">${t.add}</button></form></div>`;
  h += `<div class="card mt"><div class="t" style="font-weight:700">${t.sFavs}</div><p class="hint" style="margin:4px 0 6px">${t.sFavsD}</p>
    ${state.favs.length ? state.favs.map(f => `<div class="favrow"><div class="nm"><b>${esc(f.name)}</b><span>${f.ing.map(g => esc(g.name)+" "+mqs(g.qty, g.unit)).join(" · ")}</span></div><button class="x" data-act="delFav" data-id="${f.id}" aria-label="${t.removeFav} ${esc(f.name)}">✕</button></div>`).join("") : `<p class="small muted">${t.noFavs}</p>`}</div>`;
  h += `<div class="card mt" style="display:grid;gap:10px">

      : `<button class="btn ghost" data-act="restoreOpen">${t.bkRestore}</button>`}

/* ---- Guscio: barra in alto, contenuto, tab ---- */

const VIEWS = {week:viewWeek_, list:viewList, pantry:viewPantry, budget:viewShop, extra:viewExtra, stats:viewStats, settings:viewSettings};
function render(){
  const t = T(), inSettings = ui.tab==="settings";
  $("#bar").innerHTML = inSettings
    ? `<header class="appbar"><div class="in"><button class="backbtn" data-act="back">${I.back}${t.back}</button><div class="apptitle">${t.settings}</div><span class="spacer"></span></div></header>`
    : `<header class="appbar"><div class="in">${LOGO}<div class="brandname">Budget<em>Bite</em></div><button class="iconbtn" data-act="tab" data-tab="settings" aria-label="${t.settings}">${I.sliders}</button></div></header>`;
  $("#tabs").setAttribute("aria-label", "BudgetBite");

function go(tab){
  if(tab==="settings" && ui.tab!=="settings") ui.prevTab = ui.tab;
  ui.tab = tab; ui.restore = false; ui.confirmClear = false;

  if(tab!=="settings") try{ localStorage.setItem(LS_KEY+"-tab", tab); }catch(e){}

/* =========================================================
   8. MODULI DELLE SCHERMATE
   ========================================================= */
function blurActive(){ const a = document.activeElement; if(a && a.blur) a.blur(); }
function bindForms(){
  const t = T(), on = (id, fn) => { const f = $(id); if(f) f.onsubmit = e => { e.preventDefault(); fn(f); }; };
  on("#listForm", () => {
    const p = parseEntry($("#lName").value); if(!p.name){ toast(t.tWriteName); return; }
    state.list.push({id:uid(), name:p.name, qty:p.qty, unit:p.unit, checked:false, cat:ui.listCat || guessCat(p.name)}); commit();
    const i = $("#lName"); if(i) i.focus();
  });
  on("#itemForm", () => {
    const name = cap($("#itName").value.trim()), q = num($("#itQty").value), unit = $("#itUnit").value, cat = ui.pantryCat;
    if(!name || (cat==="food" && !(q>0))){ toast(t.tNameQty); return; }
    state.items.push({id:uid(), name, qty:q>0 ? q : null, unit, cat, added:new Date().toISOString()});
    blurActive(); commit(); toast(t.tAdded(name));
  });
  on("#expForm", () => {
    const a = num($("#exAmt").value); if(!(a>0)){ toast(t.tAmount); return; }
    state.expenses.push({id:uid(), amount:r2(a), date:$("#exDate").value || iso(new Date()), note:$("#exNote").value.trim()});
    blurActive(); commit(); toast(t.tSubtracted(eur(a)));
  });
  on("#extraForm", () => {
    const r = parseExtra($("#xIn").value); if(!r){ toast(t.tExtraNeedAmt); return; }
    state.extras.push({id:uid(), amount:r.amount, note:r.note, date:$("#xDate").value || iso(new Date()), xcat:guessXcat(r.note)});
    commit(); toast(t.tExtraDone(r.note, eur(r.amount)));
    const i = $("#xIn"); if(i) i.focus();
  });
  on("#budgetForm", () => {
    const v = ["#bW","#bM","#xW","#xM"].map(s => num($(s).value)); if(v.some(x => !(x>0))){ toast(t.tBudget); return; }
    [state.weekly, state.monthly, state.extraWeekly, state.extraMonthly] = v.map(r2); blurActive(); commit(); toast(t.tBudgetSaved);
  });
  on("#bfForm", () => {
    const v = cap($("#bfIn").value.trim()); if(!v) return;
    if(state.settings.breakfast.some(b => normName(b)===normName(v))){ toast(t.bfExists); return; }
    state.settings.breakfast.push(v); markBreakfast(state); commit(); toast(t.tBfAdded);
    const i = $("#bfIn"); if(i) i.focus();
  });
  on("#goalForm", () => {
    const amt = num($("#gAmt").value), name = $("#gName").value.trim();
    state.goal = amt>0 ? {name, amount:r2(amt)} : (name ? {name, amount:0} : null); blurActive(); commit(); toast(t.tGoalSaved);
  });
}

  const el = $("#sheetEl");
  $$("input:not([type=date]):not([type=checkbox])", el).forEach(i => i.setAttribute("enterkeyhint", blurEnter ? "done" : "enter"));

}
const sheetButtons = okLabel => `<div class="grid2"><button type="button" class="btn ghost" data-act="closeSheet">${T().cancel}</button><button class="btn" type="submit">${okLabel}</button></div>`;

/* ---- Pasto: aggiunta e modifica ---- */
function openMeal(date, slot, mealId){
  const t = T(), meal = mealId ? state.meals.find(m => m.id===mealId) : null;
  if(mealId && !meal) return;
  if(meal){ date = meal.date; slot = meal.slot; }
  const own = id => meal ? meal.ing.filter(g => g.itemId===id).reduce((s,g) => s + +g.qty, 0) : 0;
  const avail = it => remaining(it, meal && meal.id);
  const pool = state.items.filter(i => isFood(i) && (avail(i)>0 || own(i.id)>0)).sort((a,b) => a.name.localeCompare(b.name, t.locale));
  const fav = meal && findFav(meal.name);
  const favChips = !meal && state.favs.length ? `<div class="field"><span>${t.favorites}</span><div class="favs">${state.favs.map(f => `<button type="button" class="favchip" data-fav="${f.id}" aria-pressed="false">★ ${esc(f.name)}</button>`).join("")}</div></div>` : "";
  const el = sheet(`<div class="head"><div class="label">${slotLabel(slot)} · ${dayLong(parseIso(date))}</div><h2>${meal ? t.mealEditT : t.mealAddT}</h2></div>
    ${favChips}
    <label class="field"><span>${t.mealName}</span><input id="mName" placeholder="${t.phMeal}" value="${meal ? esc(meal.name) : ""}"></label>
    <div class="label">${t.ingFromPantry}</div>
    <div class="stack" id="ingRows"></div>
    <p class="hint" id="ingEmpty" hidden>${t.pantryEmptyHint}</p>
    <button type="button" class="addingr" id="addRow">${I.plus}<span>${t.addIng}</span></button>
    <div id="missBox"></div>
    <label class="checkrow"><input type="checkbox" id="mFav"><span>${fav ? t.updateFav : t.saveFav}</span></label>
    <p class="hint">${t.mealHint}</p>
    ${meal ? `<button type="button" class="btn danger" id="mDel">${t.deleteMeal}</button>` : ""}
    ${sheetButtons(meal ? t.save : t.add)}`, {form:true, blurEnter:true});
  const rows = $("#ingRows", el);
  const rowItems = except => $$(".ingr", rows).filter(d => d!==except).map(d => d.dataset.item);
  function refresh(){
    $("#ingEmpty", el).hidden = pool.length>0;
    $("#addRow", el).hidden = !pool.length || rowItems().length >= pool.length;
  }
  // Elenco degli ingredienti: toccandone uno si passa subito alla quantità.
  function openPicker(current, exceptRow, onPick){
    const taken = rowItems(exceptRow), opts = pool.filter(i => !taken.includes(i.id));
    const wrap = document.createElement("div");
    wrap.className = "pscrim";
    wrap.innerHTML = `<div class="picker" role="dialog" aria-modal="true" aria-label="${t.pickT}">
      <div class="phead"><h2>${t.pickT}</h2><button type="button" class="x" data-close aria-label="${t.close}">✕</button></div>
      <div class="plist">${opts.length ? opts.map(i => `<button type="button" class="pitem ${i.id===current ? "on" : ""}" data-id="${i.id}"><b>${esc(i.name)}</b><span class="num">${t.left} ${mqs(avail(i), i.unit)}</span></button>`).join("") : `<p class="hint" style="padding:12px 0">${t.pickEmpty}</p>`}</div></div>`;
    $("#sheetRoot").appendChild(wrap);
    wrap.addEventListener("click", e => {
      if(e.target===wrap || e.target.closest("[data-close]")){ wrap.remove(); return; }
      const b = e.target.closest(".pitem"); if(!b) return;
      wrap.remove(); onPick(b.dataset.id);
    });
  }
  function focusQty(q){ q.focus(); try{ q.setSelectionRange(0, q.value.length); }catch(e){} }
  function setRow(div, itemId, qItem, focus){
    const it = itemById(itemId), av = avail(it);
    div.dataset.item = itemId;
    $(".pickbtn b", div).textContent = it.name;
    $(".ulab", div).textContent = t.qtyIn(ul(mealUnit(it.unit)));
    $(".ingleft", div).textContent = t.inPantryLeft(mqs(av, it.unit), roundMeal(av, it.unit));
    const q = $("input", div);
    q.value = qfmt(roundMeal(qItem!=null ? qItem : defaultPortion(it, av), it.unit));
    if(focus) focusQty(q);
  }
  function addRow(itemId, qItem, focus){
    const div = document.createElement("div");
    div.className = "ingr";
    div.innerHTML = `<div class="field"><span>${t.ingredient}</span><button type="button" class="pickbtn"><b></b>${I.down}</button></div>
      <label class="field"><span class="ulab"></span><input inputmode="decimal" enterkeyhint="done" aria-label="${t.qty}"></label>
      <button type="button" class="x rm" aria-label="${t.removeIng}">✕</button><span class="hint ingleft"></span>`;
    rows.appendChild(div);
    const q = $("input", div);
    q.addEventListener("focus", () => setTimeout(() => { try{ q.setSelectionRange(0, q.value.length); }catch(e){} }, 0));
    $(".pickbtn", div).onclick = () => openPicker(div.dataset.item, div, id => setRow(div, id, null, true));
    $(".rm", div).onclick = () => { div.remove(); refresh(); };
    setRow(div, itemId, qItem, focus);
    refresh();
  }
  function showMissing(missing){
    const box = $("#missBox", el);
    if(!missing.length){ box.innerHTML = ""; return; }
    box.innerHTML = `<div class="warnbox"><b>${t.missingT}</b><ul>${missing.map(m => `<li>${esc(m.short ? t.missShort(m.name, mqs(m.have, m.unit), roundMeal(m.have, m.unit)) : t.missNone(m.name))}</li>`).join("")}</ul>
      <button type="button" class="btn sm ghost" id="missToList" style="justify-self:start">${t.toList}</button></div>`;
    $("#missToList", el).onclick = () => {
      let n = 0; for(const m of missing) if(addToList(m.name, "food", m.short ? null : m.qty, m.short ? null : m.unit)) n++;
      commit(); toast(n ? t.tAddedToList(n) : t.tAllInList); showMissing([]);
    };
  }
  if(meal) for(const g of meal.ing) if(pool.some(i => i.id===g.itemId)) addRow(g.itemId, +g.qty, false);
  refresh();
  $("#addRow", el).onclick = () => openPicker(null, null, id => addRow(id, null, true));
  $$("[data-fav]", el).forEach(b => b.onclick = () => {
    const f = state.favs.find(x => x.id===b.dataset.fav); if(!f) return;
    $("#mName", el).value = f.name; rows.innerHTML = "";
    const plan = planFav(f); plan.rows.forEach(r => addRow(r.itemId, r.qty, false)); refresh(); showMissing(plan.missing);
    $$("[data-fav]", el).forEach(x => x.setAttribute("aria-pressed", String(x===b)));
    $("#mFav", el).nextElementSibling.textContent = t.updateFav;
  });
  if(meal) $("#mDel", el).onclick = () => { closeSheet(); withUndo(t.tMealRemoved, () => { state.meals = state.meals.filter(m => m.id!==meal.id); }); };
  el.onsubmit = e => {
    e.preventDefault();
    const name = $("#mName", el).value.trim(), wantFav = $("#mFav", el).checked, ing = [], tot = {};
    for(const div of rows.children){
      const it = itemById(div.dataset.item), v = num($("input", div).value);
      if(!it) continue;
      if(!(v>0)){ toast(t.tEachQty); return; }
      const q = fromMeal(v, it.unit);
      tot[it.id] = (tot[it.id]||0) + q; ing.push({itemId:it.id, qty:q});
    }
    if(!name && !ing.length){ toast(t.mealNeedsSomething); return; }
    if(wantFav && !name){ toast(t.favNeedsName); return; }
    for(const id in tot){ const it = itemById(id), av = avail(it); if(tot[id] > av + Math.max(1e-6, av*0.002)){ toast(t.onlyLeft(it.name, mqs(av, it.unit), roundMeal(av, it.unit))); return; } }
    for(const g of ing){ const av = avail(itemById(g.itemId)); if(tot[g.itemId] > av) g.qty *= av/tot[g.itemId]; g.qty = Math.round(g.qty*10000)/10000; }
    if(meal){ meal.name = name; meal.ing = ing; } else state.meals.push({id:uid(), date, slot, name, ing});
    if(wantFav) saveFav(name, ing);
    blurActive(); closeSheet(); commit();
    toast((meal ? t.tMealSaved : t.tMealAdded) + (wantFav ? " · "+t.tFavShort : ""));
  };
}

/* ---- Prodotto ---- */
function openItem(id){
  const t = T(), it = itemById(id); if(!it) return;
  const u = used(id), [dq, du] = it.qty!=null ? toDisp(it.qty, it.unit) : [null, dispUnit(it.unit)];
  const opts = unitList().includes(du) ? unitList() : [du, ...unitList()];
  const el = sheet(`<h2>${t.editProduct}</h2>
    <label class="field"><span>${t.name}</span><input id="eName" value="${esc(it.name)}"></label>
    <div class="grid2"><label class="field"><span>${isFood(it) ? t.qty : t.qtyOpt}</span><input id="eQty" inputmode="decimal" value="${dq!=null ? qfmt(dq) : ""}"></label>
      <label class="field"><span>${t.unit}</span><select id="eUnit">${opts.map(x => `<option value="${x}" ${x===du ? "selected" : ""}>${ul(x)}</option>`).join("")}</select></label></div>
    ${u ? `<p class="hint">${t.alreadyUsed(qs(u, it.unit))}</p>` : ""}
    ${sheetButtons(t.save)}`, {form:true, blurEnter:true});
  el.onsubmit = e => {
    e.preventDefault();
    const name = cap($("#eName", el).value.trim()), q = num($("#eQty", el).value), nu = $("#eUnit", el).value;
    if(!name || (isFood(it) && !(q>0))){ toast(t.tNameQty); return; }
    const unchanged = nu===du && dq!=null && Math.abs(q - Math.round(dq*100)/100) < 0.005;
    if(!unchanged){
      if(u>0 && DIM[nu]!==DIM[it.unit]){ toast(t.cantChangeKind); return; }
      if(q>0 && q < u*F[it.unit]/F[nu] - 1e-6){ toast(t.qtyTooLow(qs(u, it.unit))); return; }
      if(u>0 && nu!==it.unit){ const k = F[it.unit]/F[nu]; state.meals.forEach(m => m.ing.forEach(g => { if(g.itemId===id) g.qty = Math.round(g.qty*k*10000)/10000; })); }
      it.qty = q>0 ? q : null; it.unit = nu;
    }
    it.name = name; blurActive(); closeSheet(); commit(); toast(t.tSaved);
  };
}

  const el = sheet(`<h2>${t.editExpenseT}</h2>

      <label class="field"><span>${t.date}</span><input id="eDate" type="date" value="${x.date}"></label></div>
    <label class="field"><span>${t.note}</span><input id="eNote" placeholder="${t.phNote}" value="${esc(x.note)}"></label>

    ${sheetButtons(t.save)}`, {form:true, blurEnter:true});

}

/* ---- Fine spesa: conferma, quantità mancanti, scontrino ---- */
function openEndShop(){
  const t = T(), sel = state.list.filter(i => i.checked).map(i => ({...i}));
  if(!sel.length) return;
  const missing = sel.filter(i => !(i.qty>0) && catOf(i)==="food");
  const total = missing.length + 1;
  let step = -1;
  const bar = cur => `<div class="steps">${Array.from({length:total}, (_,k) => `<i class="${k<=cur ? "on" : ""}"></i>`).join("")}</div>`;
  function show(){
    let body;
    if(step===-1){
      body = `<div class="head"><div class="label">${t.endLabel}</div><h2>${t.endT(sel.length)}</h2></div>
        <ul class="sum">${sel.map(i => `<li>${esc(i.name)} <span class="muted num">${i.qty>0 ? qs(i.qty, i.unit) : catOf(i)==="home" ? t.home : catOf(i)==="breakfast" ? t.breakfast : t.qtyToSet}</span></li>`).join("")}</ul>
        ${missing.length ? `<p class="hint">${t.willAsk(missing.length)}</p>` : ""}
        ${sheetButtons(t.confirm)}`;
    } else if(step < missing.length){
      const it = missing[step], du = it.unit || unitList()[0];
      body = `${bar(step)}<div class="head"><div class="label">${t.productOf(step+1, missing.length)}</div><h2>${t.howMuch(esc(it.name.toLowerCase()))}</h2></div>
        <div class="grid2"><input id="wQty" inputmode="decimal" placeholder="500" value="${it.qty>0 ? qfmt(it.qty) : ""}" aria-label="${t.qty}">
          <select id="wUnit" aria-label="${t.unit}">${unitList().map(u => `<option value="${u}" ${u===du ? "selected" : ""}>${ul(u)}</option>`).join("")}</select></div>
        <div class="grid2"><button type="button" class="btn ghost" id="wBack">${t.back}</button><button class="btn" type="submit">${t.next}</button></div>`;
    } else {
      body = `${bar(total-1)}<div class="head"><div class="label">${t.lastStep}</div><h2>${t.howMuchSpent}</h2></div>
        <label class="field"><span>${t.receiptTotal}</span><input id="wAmt" inputmode="decimal" placeholder="${t.phReceipt}"></label>
        <p class="hint">${t.receiptHint}</p>
        <div class="grid2"><button type="button" class="btn ghost" id="wBack">${t.back}</button><button class="btn" type="submit">${t.toPantry}</button></div>`;
    }
    const el = sheet(body, {form:true});
    const back = $("#wBack", el); if(back) back.onclick = () => { step--; show(); };
    el.onsubmit = e => {
      e.preventDefault();
      if(step>=0 && step<missing.length){
        const v = num($("#wQty", el).value); if(!(v>0)){ toast(t.tQtyPos); return; }
        missing[step].qty = v; missing[step].unit = $("#wUnit", el).value;
      }
      if(step===missing.length){ finish(num($("#wAmt", el).value)); return; }
      step++; show();
    };
  }
  function finish(amt){
    for(const i of sel){ const m = missing.find(x => x.id===i.id) || i; addToPantry(i.name, m.qty, m.unit || "pz", catOf(i)); }
    const ids = new Set(sel.map(i => i.id));
    state.list = state.list.filter(i => !ids.has(i.id));
    if(amt>0) state.expenses.push({id:uid(), amount:r2(amt), date:iso(new Date()), note:t.fromList});
    blurActive(); closeSheet(); commit(); toast(t.tShopDone(sel.length, amt>0 ? eur(amt) : ""));
  }
  show();
}
function addToPantry(name, qty, unit, cat){
  // Colazione e casa: un solo prodotto per nome, anche se le unità non coincidono.
  const ex = state.items.find(i => sameName(i.name, name) && catOf(i)===cat && (cat!=="food" || DIM[i.unit]===DIM[unit]));
  if(ex){
    if(qty>0 && ex.qty==null){ ex.qty = qty; ex.unit = unit; }
    else if(qty>0 && DIM[ex.unit]===DIM[unit]) ex.qty = Math.round((ex.qty + qty*F[unit]/F[ex.unit])*1000)/1000;
  }
  else state.items.push({id:uid(), name, qty:qty>0 ? qty : null, unit, cat, added:new Date().toISOString()});
}

/* ---- Dati di esempio ---- */
function loadSample(){
  const t = T(), ex = t.ex, now = new Date().toISOString(), ws = sow(new Date());
  const fish = {id:uid(), name:ex.fish, qty:300, unit:"g", cat:"food", added:now};
  const pasta = {id:uid(), name:ex.pasta, qty:500, unit:"g", cat:"food", added:now};
  const zucc = {id:uid(), name:ex.zucc, qty:4, unit:"pz", cat:"food", added:now};
  state.items.push(fish, pasta, zucc);
  state.meals.push({id:uid(), date:iso(ws), slot:"pranzo", name:ex.meal1, ing:[{itemId:fish.id, qty:150},{itemId:zucc.id, qty:2}]});
  state.meals.push({id:uid(), date:iso(addDays(ws,1)), slot:"cena", name:ex.meal2, ing:[{itemId:pasta.id, qty:100},{itemId:zucc.id, qty:1}]});
  if(!findFav(ex.meal2)) state.favs.push({id:uid(), name:ex.meal2, ing:[{name:ex.pasta, qty:100, unit:"g"},{name:ex.zucc, qty:1, unit:"pz"}]});
  state.expenses.push({id:uid(), amount:27.5, date:iso(new Date()), note:ex.shop});
  state.extras.push({id:uid(), amount:3.5, date:iso(new Date()), note:ex.x1, xcat:"food"}, {id:uid(), amount:9, date:iso(new Date()), note:ex.x2, xcat:"fun"});
  commit(); toast(t.tExample);
}

/* =========================================================
   10. AZIONI (tocchi) E TASTIERA
   ========================================================= */
const A = {
  tab: el => go(el.dataset.tab),
  back: () => go(ui.prevTab && ui.prevTab!=="settings" ? ui.prevTab : "week"),
  closeSheet: (el, e) => { if(el.classList.contains("scrim") && e.target!==el) return; blurActive(); closeSheet(); },
  weekPrev: () => { ui.weekOffset--; render(); },
  weekNext: () => { ui.weekOffset++; render(); },
  weekToday: () => { ui.weekOffset = 0; render(); },
  addMeal: el => openMeal(el.dataset.date, el.dataset.slot),
  editMeal: el => openMeal(null, null, el.dataset.id),
  delMeal: el => withUndo(T().tMealRemoved, () => { state.meals = state.meals.filter(m => m.id!==el.dataset.id); }),
  toggleDone: () => { ui.showDone = !ui.showDone; render(); },
  pantryCat: el => { ui.pantryCat = el.dataset.cat; render(); },
  editItem: el => openItem(el.dataset.id),
  delItem: el => {
    const id = el.dataset.id, it = itemById(id); if(!it) return;
    withUndo(isFood(it) ? T().tProductDeleted : T().tPlainDone, () => {
      state.items = state.items.filter(i => i.id!==id);
      state.meals.forEach(m => { m.ing = m.ing.filter(g => g.itemId!==id); });
      state.meals = state.meals.filter(m => m.ing.length || m.name);
    });
  },
  itemToList: el => { const it = itemById(el.dataset.id); if(it && addToList(it.name, catOf(it))){ commit(); toast(T().tToList(it.name)); } },
  toggleCheck: el => { const it = state.list.find(i => i.id===el.dataset.id); if(it){ it.checked = !it.checked; commit(); } },
  flipCat: el => { const it = state.list.find(i => i.id===el.dataset.id), order = ["food","breakfast","home"]; if(it){ it.cat = order[(order.indexOf(catOf(it))+1) % 3]; commit(); } },
  delListItem: el => withUndo(T().tListRemoved, () => { state.list = state.list.filter(i => i.id!==el.dataset.id); }),
  listCat: el => { ui.listCat = el.dataset.cat==="auto" ? null : el.dataset.cat; $$("[data-act=listCat]").forEach(b => b.setAttribute("aria-pressed", String(b===el))); },
  endShop: () => openEndShop(),
  editExpense: el => openExpense(el.dataset.id),
  editExtra: el => openExtra(el.dataset.id),
  statsPeriod: el => { ui.statsPeriod = el.dataset.p; render(); },
  piggyOut: () => openPiggyOut(),
  delPiggyOut: el => withUndo(T().tWithdrawalDeleted, () => { state.piggyOut = state.piggyOut.filter(o => o.id!==el.dataset.id); }),
  setOpt: el => {
    const k = el.dataset.key; let v = el.dataset.val;
    if(k==="weekStart") v = Number(v);
    if(String(state.settings[k])===String(v)) return;
    state.settings[k] = v;
    if(k==="carry") state.settings.carryFrom = v==="off" ? null : iso(sow(new Date()));
    if(k==="weekStart") ui.weekOffset = 0;
    applyTheme(); commit();
  },
  delBf: el => withUndo(T().tBfRemoved, () => { state.settings.breakfast.splice(Number(el.dataset.i), 1); }),
  delFav: el => withUndo(T().tFavRemoved, () => { state.favs = state.favs.filter(f => f.id!==el.dataset.id); }),
  backupCopy: () => {
    const t = T(), txt = JSON.stringify(Object.assign({app:"BudgetBite"}, state));
    const fallback = () => { const o = $("#bkOut"); o.hidden = false; o.value = txt; o.focus(); o.select(); toast(t.bkSelect); };
    try{ navigator.clipboard.writeText(txt).then(() => toast(t.bkCopied), fallback); }catch(e){ fallback(); }
  },
  restoreOpen: () => { ui.restore = true; render(); },
  restoreCancel: () => { ui.restore = false; render(); },
  restoreImport: () => {
    let o = null;
    try{ o = JSON.parse($("#bkIn").value.trim()); }catch(e){}
    if(!o || o.v!==1 || !Array.isArray(o.items)){ toast(T().bkBad); return; }
    delete o.app; ui.restore = false;
    withUndo(T().bkDone, () => { state = normalize(o); applyTheme(); });
  },
  sample: () => loadSample(),
  clearAsk: () => { ui.confirmClear = true; render(); },
  clearCancel: () => { ui.confirmClear = false; render(); },
  clearAll: () => {
    ui.confirmClear = false;
    withUndo(T().tCleared, () => { const b = blank(); for(const k of ["settings","weekly","monthly","extraWeekly","extraMonthly","goal"]) b[k] = state[k]; state = b; });
  },
  kbDone: () => { blurActive(); hideKb(); setTimeout(resetViewport, 80); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(el && A[el.dataset.act]) A[el.dataset.act](el, e);
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape") closeSheet();
  if(e.key==="Enter" && e.target.matches && e.target.matches("input")){
    const f = e.target.form;
    if(f && f.dataset.enter==="blur"){ e.preventDefault(); e.target.blur(); }
  }
});
// Il tastierino numerico dell'iPhone non ha un tasto per chiudersi: mostriamo "Fine" in alto.
let kbTimer;
function hideKb(){ $("#kbRoot").innerHTML = ""; }
const isTyping = el => el && el.matches && el.matches("input:not([type=checkbox]):not([type=date]),textarea");
document.addEventListener("focusin", e => {
  if(!isTyping(e.target)) return;
  clearTimeout(kbTimer);
  $("#kbRoot").innerHTML = `<button type="button" class="kbdone" data-act="kbDone">${I.down}${T().kbDone}</button>`;
  placeKb();
});
document.addEventListener("focusout", () => { kbTimer = setTimeout(() => { if(!isTyping(document.activeElement)){ hideKb(); resetViewport(); } }, 150); });
// Su iPhone, dopo che la tastiera si chiude la pagina a volte resta spostata: la riportiamo a posto.
function resetViewport(){ if(!isTyping(document.activeElement) && (window.scrollY || document.documentElement.scrollTop)) window.scrollTo(0, 0); }
function placeKb(){
  const b = $(".kbdone"), vv = window.visualViewport; if(!b || !vv) return;
  b.style.top = vv.offsetTop > 0 ? (vv.offsetTop + 12) + "px" : "";
}
if(window.visualViewport){
  visualViewport.addEventListener("resize", () => { placeKb(); setTimeout(resetViewport, 80); });
  visualViewport.addEventListener("scroll", placeKb);
}
