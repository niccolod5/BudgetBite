/* ---- Guscio: barra in alto, contenuto, tab ---- */
const TABS = [["week","tabWeek"],["list","tabList"],["pantry","tabPantry"],["budget","tabShop"],["extra","tabExtra"],["stats","tabStats"]];
const VIEWS = {week:viewWeek_, list:viewList, pantry:viewPantry, budget:viewShop, extra:viewExtra, stats:viewStats, settings:viewSettings};
function render(){
  const t = T(), inSettings = ui.tab==="settings";
  $("#bar").innerHTML = inSettings
    ? `<header class="appbar"><div class="in"><button class="backbtn" data-act="back">${I.back}${t.back}</button><div class="apptitle">${t.settings}</div><span class="spacer"></span></div></header>`
    : `<header class="appbar"><div class="in">${LOGO}<div class="brandname">Budget<em>Bite</em></div><button class="iconbtn" data-act="tab" data-tab="settings" aria-label="${t.settings}">${I.sliders}</button></div></header>`;
  $("#tabs").setAttribute("aria-label", "BudgetBite");
  $("#tabs").innerHTML = `<div class="in" role="tablist">${TABS.map(([k,l]) => `<button role="tab" data-act="tab" data-tab="${k}" aria-selected="${ui.tab===k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TAB_ICONS[k]}</svg>${t[l]}</button>`).join("")}</div>`;
  const sc = $("#scroller"), y = sc.scrollTop;
  $("#app").innerHTML = (VIEWS[ui.tab] || viewWeek_)();
  sc.scrollTop = y;
  // "Fine spesa" sta in una barra sopra le tab, fuori dalla lista: non copre più i prodotti.
  const dock = $("#dock"), nCart = state.list.filter(i => i.checked).length, showDock = ui.tab==="list" && nCart>0;
  dock.hidden = !showDock;
  dock.innerHTML = showDock ? `<button class="btn" data-act="endShop">${t.endShop(nCart)}</button>` : "";
  document.documentElement.style.setProperty("--toastB", ($("#tabs").offsetHeight + (showDock ? dock.offsetHeight : 0) + 12) + "px");
  bindForms();
  $$("input:not([type=date]):not([type=checkbox])").forEach(i => i.setAttribute("enterkeyhint", i.form && i.form.dataset.enter==="blur" ? "done" : "enter"));
}
function go(tab){
  if(tab==="settings" && ui.tab!=="settings") ui.prevTab = ui.tab;
  ui.tab = tab; ui.restore = false; ui.confirmClear = false;
  closeSheet(); render(); $("#scroller").scrollTop = 0;
  if(tab!=="settings") try{ localStorage.setItem(LS_KEY+"-tab", tab); }catch(e){}
}

/* =========================================================
   8. MODULI DELLE SCHERMATE
   ========================================================= */
function blurActive(){ const a = document.activeElement; if(a && a.blur) a.blur(); }
function bindForms(){
  const t = T(), on = (id, fn) => { const f = $(id); if(f) f.onsubmit = e => { e.preventDefault(); fn(f); }; };
  on("#listForm", () => {
    const p = parseEntry($("#lName").value); if(!p.name){ toast(t.tWriteName); return; }
    const later = !!($("#lLaterChk") && $("#lLaterChk").checked);
    state.list.push({id:uid(), name:p.name, qty:p.qty, unit:p.unit, checked:false, later, cat:ui.listCat || guessCat(p.name)}); commit();
    if(later) toast(t.tMovedLater(p.name));
    const i = $("#lName"); if(i) i.focus();
  });
  on("#itemForm", () => {
    const name = cap($("#itName").value.trim()), q = num($("#itQty").value), unit = $("#itUnit").value;
    // Merenda e bibite vanno nella loro sezione, colazione, condimenti e casa non si tengono in dispensa.
    const c = name ? guessCat(name) : "food";
    if(KEPT.includes(c)){ addKept(name, c); blurActive(); commit(); toast(t.tKeptAdded(name, t.catL[c])); return; }
    if(c!=="food"){ toast(t.tNotKept(name, t.catL[c])); return; }
    if(!name || !(q>0)){ toast(t.tNameQty); return; }
    state.items.push({id:uid(), name, qty:q, unit, cat:"food", added:new Date().toISOString()});
    blurActive(); commit(); toast(t.tAdded(name));
  });
  on("#expForm", () => {
    const a = num($("#exAmt").value); if(!(a>0)){ toast(t.tAmount); return; }
    state.expenses.push({id:uid(), amount:r2(a), date:$("#exDate").value || iso(new Date()), note:$("#exNote").value.trim()});
    blurActive(); commit(); toast(t.tSubtracted(eur(a)));
  });
  on("#extraForm", () => {
    const r = parseExtra($("#xIn").value); if(!r){ toast(t.tExtraNeedAmt); return; }
    state.extras.push({id:uid(), amount:r.amount, note:r.note, date:$("#xDate").value || iso(new Date()), xcat:guessXcat(r.note)});
    commit(); toast(t.tExtraDone(r.note, eur(r.amount)));
    const i = $("#xIn"); if(i) i.focus();
  });
  on("#budgetForm", () => {
    const v = ["#bW","#bM","#xW","#xM"].map(s => num($(s).value)); if(v.some(x => !(x>0))){ toast(t.tBudget); return; }
    const ov = ["#oS","#oX"].map(s => $(s).value.trim() ? num($(s).value) : null); if(ov.some(x => x!==null && !(x>0))){ toast(t.tBudget); return; }
    [state.weekly, state.monthly, state.extraWeekly, state.extraMonthly] = v.map(r2);
    if(ov[0]===null && ov[1]===null) delete state.monthBudgets[monthKey()];
    else state.monthBudgets[monthKey()] = {shop:ov[0]===null ? null : r2(ov[0]), extra:ov[1]===null ? null : r2(ov[1])};
    blurActive(); commit(); toast(t.tBudgetSaved);
  });
  on("#kwForm", () => {
    const c = ui.kwCat || "breakfast", v = cap($("#kwIn").value.trim()); if(!v) return;
    const other = KW_CATS.find(k => state.settings[k].some(b => normName(b)===normName(v)));
    if(other){ toast(other===c ? t.bfExists : t.kwElsewhere(t.catL[other])); return; }
    state.settings[c].push(v); markCats(state); commit(); toast(t.tKwAdded(t.catL[c]));
    const i = $("#kwIn"); if(i) i.focus();
  });
  on("#keptForm", () => {
    const c = ui.pantryCat, name = cap($("#kName").value.trim()); if(!name || !KEPT.includes(c)) return;
    // Se il nome non è ancora nell'elenco della categoria lo si aggiunge, così la prossima volta lo riconosce da solo.
    if(catByName(name, state.settings)!==c && !KW_CATS.some(k => state.settings[k].some(b => normName(b)===normName(name)))) state.settings[c].push(name);
    addKept(name, c); commit(); toast(t.tKeptAdded(name, t.catL[c]));
    const i = $("#kName"); if(i) i.focus();
  });
  const lcat = $("#lCat"); if(lcat) lcat.onchange = () => { ui.listCat = lcat.value==="auto" ? null : lcat.value; };
  const lch = $("#lLaterChk"); if(lch) lch.onchange = () => { ui.addLater = lch.checked; };
  const msSel = $("#msSel");
  if(msSel) msSel.onchange = () => { state.settings.monthStart = Number(msSel.value); commit(); };
  on("#goalForm", () => {
    const amt = num($("#gAmt").value), name = $("#gName").value.trim();
    state.goal = amt>0 ? {name, amount:r2(amt)} : (name ? {name, amount:0} : null); blurActive(); commit(); toast(t.tGoalSaved);
  });
}

/* =========================================================
   9. FOGLI (pasto, prodotto, spesa, extra, fine spesa, salvadanaio)
   ========================================================= */
function closeSheet(){ $("#sheetRoot").innerHTML = ""; }
function sheet(inner, {form=false, blurEnter=false} = {}){
  const tag = form ? "form" : "div";
  $("#sheetRoot").innerHTML = `<div class="scrim" data-act="closeSheet"><${tag} class="sheet" id="sheetEl" ${blurEnter ? 'data-enter="blur"' : ""} role="dialog" aria-modal="true" autocomplete="off"><div class="grab"></div>${inner}</${tag}></div>`;
  const el = $("#sheetEl");
  $$("input:not([type=date]):not([type=checkbox])", el).forEach(i => i.setAttribute("enterkeyhint", blurEnter ? "done" : "enter"));
  swipeToClose(el, el.parentNode, () => el, () => { blurActive(); closeSheet(); });
  return el;
}
// Trascinare un foglio verso il basso lo chiude, come Annulla: non salva nulla.
// Parte solo se il contenuto è già in cima, così lo scorrimento normale resta com'è.
function swipeToClose(panel, scrim, scrollerOf, close){
  let x0 = 0, y0 = 0, dy = 0, v = 0, lastY = 0, lastT = 0, mode = null;
  const base = (getComputedStyle(scrim).backgroundColor.match(/[\d.]+/g) || []).map(Number);
  const tint = k => { if(base.length>=3) scrim.style.backgroundColor = `rgba(${base[0]},${base[1]},${base[2]},${(base[3] ?? 1)*k})`; };
  panel.addEventListener("touchstart", e => {
    const p = e.touches[0], sc = scrollerOf(e.target), a = document.activeElement;
    mode = e.touches.length!==1 || (sc && sc.scrollTop>0) || (e.target===a && a.matches("input,textarea")) ? "no" : null;
    x0 = p.clientX; y0 = lastY = p.clientY; lastT = e.timeStamp; dy = 0; v = 0;
  }, {passive:true});
  panel.addEventListener("touchmove", e => {
    if(mode==="no" || mode==="done") return;
    if(e.touches.length!==1){ if(mode==="drag") snap(); mode = "no"; return; }
    const p = e.touches[0], ddy = p.clientY - y0, ddx = p.clientX - x0;
    if(mode===null && (ddy<0 || Math.abs(ddx)>ddy)){ mode = "no"; return; }
    if(e.cancelable) e.preventDefault();
    if(mode===null){ if(ddy<4) return; mode = "drag"; panel.style.animation = "none"; panel.style.transition = "none"; }
    const dt = e.timeStamp - lastT;
    if(dt>0){ v = 0.6*v + 0.4*(p.clientY - lastY)/dt; lastY = p.clientY; lastT = e.timeStamp; }
    dy = Math.max(0, ddy);
    panel.style.transform = `translateY(${dy}px)`;
    tint(Math.max(0, 1 - dy/(panel.offsetHeight || 400)));
  }, {passive:false});
  function snap(){
    panel.style.transition = "transform .2s ease-out"; panel.style.transform = "";
    scrim.style.transition = "background-color .2s"; scrim.style.backgroundColor = "";
  }
  const end = () => {
    if(mode!=="drag"){ if(mode!=="done") mode = null; return; }
    const h = panel.offsetHeight || 400;
    if(dy > Math.min(140, h*0.3) || (dy>40 && v>0.45)){
      mode = "done";
      panel.style.transition = "transform .2s ease-in"; panel.style.transform = `translateY(${h + 40}px)`;
      scrim.style.transition = "background-color .2s"; tint(0);
      setTimeout(close, 190);
    } else { mode = null; snap(); }
  };
  panel.addEventListener("touchend", end);
  panel.addEventListener("touchcancel", end);
}
const sheetButtons = okLabel => `<div class="grid2"><button type="button" class="btn ghost" data-act="closeSheet">${T().cancel}</button><button class="btn" type="submit">${okLabel}</button></div>`;

/* ---- Pasto: aggiunta e modifica ---- */
// Due tipi di ingrediente: dalla dispensa (scala le quantità) oppure provvisorio, cioè un nome e una quantità
// da comprare. I provvisori non toccano la dispensa e si collegano da soli quando li compri (vedi linkPlanned).
function openMeal(date, slot, mealId){
  const t = T(), meal = mealId ? state.meals.find(m => m.id===mealId) : null;
  if(mealId && !meal) return;
  if(meal){ date = meal.date; slot = meal.slot; }
  const own = id => meal ? meal.ing.filter(g => g.itemId===id).reduce((s,g) => s + +g.qty, 0) : 0;
  const avail = it => remaining(it, meal && meal.id);
  const pool = state.items.filter(i => isFood(i) && (avail(i)>0 || own(i.id)>0)).sort((a,b) => a.name.localeCompare(b.name, t.locale));
  const fav = meal && findFav(meal.name);
  const favChips = !meal && state.favs.length ? `<div class="field"><span>${t.favorites}</span><div class="favs">${state.favs.map(f => `<button type="button" class="favchip" data-fav="${f.id}" aria-pressed="false">★ ${esc(f.name)}</button>`).join("")}</div></div>` : "";
  const el = sheet(`<div class="head"><div class="label">${slotLabel(slot)} · ${dayLong(parseIso(date))}</div><h2>${meal ? t.mealEditT : t.mealAddT}</h2></div>
    ${favChips}
    <label class="field"><span>${t.mealName}</span><input id="mName" placeholder="${t.phMeal}" value="${meal ? esc(meal.name) : ""}"></label>
    <div class="label">${t.ingredients}</div>
    <div class="stack" id="ingRows"></div>
    <p class="hint" id="ingEmpty" hidden>${t.pantryEmptyHint}</p>
    <button type="button" class="addingr" id="addRow">${I.plus}<span>${t.addIng}</span></button>
    <div id="missBox"></div>
    <label class="checkrow"><input type="checkbox" id="mFav"><span>${fav ? t.updateFav : t.saveFav}</span></label>
    <p class="hint">${t.mealHint}</p>
    ${meal ? `<button type="button" class="btn danger" id="mDel">${t.deleteMeal}</button>` : ""}
    ${sheetButtons(meal ? t.save : t.add)}`, {form:true, blurEnter:true});
  const rows = $("#ingRows", el);
  const rowItems = except => $$(".ingr:not(.plan)", rows).filter(d => d!==except).map(d => d.dataset.item);
  function refresh(){ $("#ingEmpty", el).hidden = pool.length>0; }
  // Elenco degli ingredienti: toccandone uno si passa subito alla quantità. In cima, "Non è in dispensa".
  function openPicker(current, exceptRow, onPick, onPlan){
    const taken = rowItems(exceptRow), opts = pool.filter(i => !taken.includes(i.id));
    const wrap = document.createElement("div");
    wrap.className = "pscrim";
    wrap.innerHTML = `<div class="picker" role="dialog" aria-modal="true" aria-label="${t.pickT}"><div class="grab"></div>
      <div class="phead"><h2>${t.pickT}</h2><button type="button" class="x" data-close aria-label="${t.close}">✕</button></div>
      <div class="plist">${onPlan ? `<button type="button" class="pitem plan" data-plan="1"><b>✎ ${t.notInPantry}</b><span>${t.notInPantryD}</span></button>` : ""}
        ${opts.length ? opts.map(i => `<button type="button" class="pitem ${i.id===current ? "on" : ""}" data-id="${i.id}"><b>${esc(i.name)}</b><span class="num">${t.left} ${mqs(avail(i), i.unit)}</span></button>`).join("") : `<p class="hint" style="padding:12px 0">${t.pickEmpty}</p>`}</div></div>`;
    $("#sheetRoot").appendChild(wrap);
    swipeToClose($(".picker", wrap), wrap, el => el.closest(".plist"), () => wrap.remove());
    wrap.addEventListener("click", e => {
      if(e.target===wrap || e.target.closest("[data-close]")){ wrap.remove(); return; }
      const b = e.target.closest(".pitem"); if(!b) return;
      wrap.remove();
      if(b.dataset.plan) onPlan(); else onPick(b.dataset.id);
    });
  }
  function focusQty(q){ q.focus(); try{ q.setSelectionRange(0, q.value.length); }catch(e){} }
  const selectAllOnFocus = q => q.addEventListener("focus", () => setTimeout(() => { try{ q.setSelectionRange(0, q.value.length); }catch(e){} }, 0));
  function place(div, before){ if(before) rows.insertBefore(div, before); else rows.appendChild(div); }
  function setRow(div, itemId, qItem, focus){
    const it = itemById(itemId), av = avail(it);
    div.dataset.item = itemId;
    $(".pickbtn b", div).textContent = it.name;
    $(".ulab", div).textContent = t.qtyIn(ul(mealUnit(it.unit)));
    $(".ingleft", div).textContent = t.inPantryLeft(mqs(av, it.unit), roundMeal(av, it.unit));
    const q = $("input", div);
    q.value = qfmt(roundMeal(qItem!=null ? qItem : defaultPortion(it, av), it.unit));
    if(focus) focusQty(q);
  }
  // Riga di un ingrediente della dispensa.
  function addRow(itemId, qItem, focus, before){
    const div = document.createElement("div");
    div.className = "ingr";
    div.innerHTML = `<div class="field"><span>${t.ingredient}</span><button type="button" class="pickbtn"><b></b>${I.down}</button></div>
      <label class="field"><span class="ulab"></span><input inputmode="decimal" enterkeyhint="done" aria-label="${t.qty}"></label>
      <button type="button" class="x rm" aria-label="${t.removeIng}">✕</button><span class="hint ingleft"></span>`;
    place(div, before);
    selectAllOnFocus($("input", div));
    $(".pickbtn", div).onclick = () => openPicker(div.dataset.item, div, id => setRow(div, id, null, true),
      () => { const it = itemById(div.dataset.item); addPlanRow({name:it ? it.name : ""}, true, div); div.remove(); });
    $(".rm", div).onclick = () => { div.remove(); refresh(); };
    setRow(div, itemId, qItem, focus);
    refresh();
  }
  // Riga di un ingrediente provvisorio: nome, quantità e unità scritti a mano.
  function addPlanRow(g, focus, before){
    const units = state.settings.units==="imperial" ? ["oz","fl oz","pz"] : ["g","ml","pz"];
    const u = g && g.unit ? mealUnit(g.unit) : units[0];
    const v = g && g.qty>0 ? roundMeal(g.qty, g.unit) : u==="pz" ? 1 : (u==="oz" || u==="fl oz") ? 3.5 : 100;
    const div = document.createElement("div");
    div.className = "ingr plan";
    div.innerHTML = `<label class="field"><span>${t.planName}</span><input class="pname" placeholder="${t.phPlanName}" value="${esc(g && g.name || "")}"></label>
      <button type="button" class="x rm" aria-label="${t.removeIng}">✕</button>
      <div class="planq"><label class="field"><span>${t.qty}</span><input class="pqty" inputmode="decimal" enterkeyhint="done" value="${qfmt(v)}"></label>
        <label class="field"><span>${t.unit}</span><select class="punit">${units.map(x => `<option value="${x}" ${x===u ? "selected" : ""}>${ul(x)}</option>`).join("")}</select></label></div>
      <div class="planfoot"><span class="chip coin">${t.toBuyTag}</span>${pool.length ? `<button type="button" class="link small pfrom">${t.pickFromPantry}</button>` : ""}</div>`;
    place(div, before);
    selectAllOnFocus($(".pqty", div));
    $(".rm", div).onclick = () => { div.remove(); refresh(); };
    const pf = $(".pfrom", div);
    if(pf) pf.onclick = () => openPicker(null, null, id => {
      const it = itemById(id), qd = num($(".pqty", div).value), pu = $(".punit", div).value;
      const qItem = qd>0 && DIM[pu]===DIM[it.unit] ? Math.min(qd*F[pu]/F[it.unit], avail(it)) : null;
      addRow(id, qItem, true, div); div.remove(); refresh();
    });
    if(focus){ const n = $(".pname", div); if(n.value) focusQty($(".pqty", div)); else n.focus(); }
    refresh();
  }
  function showMissing(missing){
    const box = $("#missBox", el);
    if(!missing.length){ box.innerHTML = ""; return; }
    box.innerHTML = `<div class="warnbox"><b>${t.missingT}</b><ul>${missing.map(m => `<li>${esc(m.short ? t.missShort(m.name, mqs(m.have, m.unit), roundMeal(m.have, m.unit)) : t.missNone(m.name))}</li>`).join("")}</ul>
      <button type="button" class="btn sm ghost" id="missToList" style="justify-self:start">${t.toList}</button></div>`;
    $("#missToList", el).onclick = () => {
      let n = 0; for(const m of missing) if(addToList(m.name, "food", null, null, m.need)) n++;
      commit(); toast(n ? t.tAddedToList(n) : t.tAllInList); showMissing([]);
    };
  }
  if(meal) for(const g of meal.ing){
    if(g.plan) addPlanRow(g, false);
    else if(pool.some(i => i.id===g.itemId)) addRow(g.itemId, +g.qty, false);
  }
  refresh();
  $("#addRow", el).onclick = () => pool.length ? openPicker(null, null, id => addRow(id, null, true), () => addPlanRow(null, true)) : addPlanRow(null, true);
  $$("[data-fav]", el).forEach(b => b.onclick = () => {
    const f = state.favs.find(x => x.id===b.dataset.fav); if(!f) return;
    $("#mName", el).value = f.name; rows.innerHTML = "";
    const plan = planFav(f);
    plan.rows.forEach(r => addRow(r.itemId, r.qty, false));
    plan.planned.forEach(g => addPlanRow(g, false));
    refresh(); showMissing(plan.missing);
    $$("[data-fav]", el).forEach(x => x.setAttribute("aria-pressed", String(x===b)));
    $("#mFav", el).nextElementSibling.textContent = t.updateFav;
  });
  if(meal) $("#mDel", el).onclick = () => { closeSheet(); withUndo(t.tMealRemoved, () => { state.meals = state.meals.filter(m => m.id!==meal.id); }); };
  el.onsubmit = e => {
    e.preventDefault();
    const name = $("#mName", el).value.trim(), wantFav = $("#mFav", el).checked, ing = [], tot = {};
    for(const div of rows.children){
      if(div.classList.contains("plan")){
        const pn = cap($(".pname", div).value.trim()), pv = num($(".pqty", div).value);
        if(!pn){ toast(t.planNeedsName); return; }
        if(!(pv>0)){ toast(t.tEachQty); return; }
        ing.push({name:pn, qty:pv, unit:$(".punit", div).value, plan:true});
        continue;
      }
      const it = itemById(div.dataset.item), v = num($("input", div).value);
      if(!it) continue;
      if(!(v>0)){ toast(t.tEachQty); return; }
      const q = fromMeal(v, it.unit);
      tot[it.id] = (tot[it.id]||0) + q; ing.push({itemId:it.id, qty:q});
    }
    if(!name && !ing.length){ toast(t.mealNeedsSomething); return; }
    if(wantFav && !name){ toast(t.favNeedsName); return; }
    for(const id in tot){ const it = itemById(id), av = avail(it); if(tot[id] > av + Math.max(1e-6, av*0.002)){ toast(t.onlyLeft(it.name, mqs(av, it.unit), roundMeal(av, it.unit))); return; } }
    for(const g of ing){ if(g.plan) continue; const av = avail(itemById(g.itemId)); if(tot[g.itemId] > av) g.qty *= av/tot[g.itemId]; g.qty = Math.round(g.qty*10000)/10000; }
    if(meal){ meal.name = name; meal.ing = ing; } else state.meals.push({id:uid(), date, slot, name, ing});
    if(wantFav) saveFav(name, ing);
    blurActive(); closeSheet(); commit();
    toast((meal ? t.tMealSaved : t.tMealAdded) + (wantFav ? " · "+t.tFavShort : ""));
  };
}

/* ---- Voce della lista: nome, quantità, categoria ---- */
function openListItem(id){
  const t = T(), it = state.list.find(i => i.id===id); if(!it) return;
  let cat = catOf(it);
  const [dq, du] = it.qty>0 ? toDisp(it.qty, it.unit) : [null, null];
  const units = unitList(), uSel = du || "";
  const el = sheet(`<h2>${t.editListT}</h2>
    <label class="field"><span>${t.name}</span><input id="liName" value="${esc(it.name)}"></label>
    <div class="grid2"><label class="field"><span>${t.qtyOpt}</span><input id="liQty" inputmode="decimal" value="${dq!=null ? qfmt(dq) : ""}"></label>
      <label class="field"><span>${t.unit}</span><select id="liUnit"><option value="" ${uSel ? "" : "selected"}>${t.noUnit}</option>${units.map(u => `<option value="${u}" ${u===uSel ? "selected" : ""}>${ul(u)}</option>`).join("")}</select></label></div>
    <p class="hint">${t.qtyListHint}</p>
    <div class="field"><span>${t.when}</span><div class="seg" id="liWhen"><button type="button" data-w="next" aria-pressed="${!it.later}">${t.nextShop}</button><button type="button" data-w="later" aria-pressed="${!!it.later}">${t.forLater}</button></div></div>
    <div class="field"><span>${t.category}</span><div class="seg g3" id="liCat">${CATS.map(c => `<button type="button" data-c="${c}" aria-pressed="${cat===c}">${t.catS[c]}</button>`).join("")}</div></div>
    <button type="button" class="btn danger" id="liDel">${t.removeFromList}</button>
    ${sheetButtons(t.save)}`, {form:true, blurEnter:true});
  $$("#liCat button", el).forEach(b => b.onclick = () => { cat = b.dataset.c; $$("#liCat button", el).forEach(x => x.setAttribute("aria-pressed", String(x===b))); });
  let later = !!it.later;
  $$("#liWhen button", el).forEach(b => b.onclick = () => { later = b.dataset.w==="later"; $$("#liWhen button", el).forEach(x => x.setAttribute("aria-pressed", String(x===b))); });
  $("#liDel", el).onclick = () => { closeSheet(); withUndo(t.tListRemoved, () => { state.list = state.list.filter(i => i.id!==id); }); };
  el.onsubmit = e => {
    e.preventDefault();
    const raw = $("#liName", el).value.trim(); if(!raw){ toast(t.tWriteName); return; }
    let q = num($("#liQty", el).value), u = $("#liUnit", el).value;
    // Se nel nome si scrive anche la quantità ("Pomodori 500g") la si riconosce come all'inserimento.
    const p = parseEntry(raw);
    if(!(q>0) && p.qty>0){ q = p.qty; u = p.unit; }
    if(q>0 && !u) u = "pz";
    const moved = later!==!!it.later;
    Object.assign(it, {name:p.name || cap(raw), qty:q>0 ? q : null, unit:q>0 ? u : null, cat, later});
    if(later) it.checked = false;
    if(moved) moveToEnd(it);
    blurActive(); closeSheet(); commit(); toast(moved ? (later ? t.tMovedLater(it.name) : t.tMovedNext(it.name)) : t.tListSaved);
  };
}

/* ---- Spostare un pasto: tieni premuto un pasto e trascinalo su un altro pranzo o cena ----
   Se il posto è già occupato i pasti si scambiano. Tenendolo sulle frecce della settimana si cambia settimana. */
// Gli eventi del dito si ascoltano sull'elemento toccato: se la settimana cambia durante il trascinamento
// l'elemento esce dalla pagina e gli eventi non arrivano più al documento, ma a lui sì.
let md = null;
document.addEventListener("touchstart", e => {
  if(md || ui.tab!=="week" || e.touches.length!==1 || $("#sheetRoot").children.length) return;
  const card = e.target.closest && e.target.closest(".meal[data-id]");
  if(!card || e.target.closest(".x")) return;
  const p = e.touches[0], tgt = e.target;
  md = {id:card.dataset.id, card, tgt, x0:p.clientX, y0:p.clientY, x:p.clientX, y:p.clientY, on:false, slot:null, nav:null};
  md.timer = setTimeout(mealDragStart, 420);
  tgt.addEventListener("touchmove", mealDragMove, {passive:false});
  tgt.addEventListener("touchend", mealDragUp, {passive:false});
  tgt.addEventListener("touchcancel", mealDragUp, {passive:false});
}, {passive:true});
function mealDragMove(e){
  if(!md) return;
  const p = e.touches[0]; md.x = p.clientX; md.y = p.clientY;
  if(md.on){ if(e.cancelable) e.preventDefault(); return; }
  if(Math.abs(md.x - md.x0) > 8 || Math.abs(md.y - md.y0) > 8) mealDragEnd(e, true);
}
function mealDragUp(e){ mealDragEnd(e, e.type==="touchcancel"); }
function mealDragStart(){
  if(!md || !document.body.contains(md.card)){ md = null; return; }
  const r = md.card.getBoundingClientRect(), g = md.card.cloneNode(true);
  g.classList.add("mghost"); g.removeAttribute("data-id"); g.setAttribute("aria-hidden", "true");
  Object.assign(g.style, {left:r.left+"px", top:r.top+"px", width:r.width+"px"});
  document.body.appendChild(g);
  md.on = true; md.ghost = g;
  md.card.classList.add("msrc");
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(err){}
  md.raf = requestAnimationFrame(mealDragTick);
}
function mealDragTick(){
  if(!md || !md.on) return;
  const sc = $("#scroller"), b = sc.getBoundingClientRect(), edge = 80;
  if(md.y < b.top + edge) sc.scrollTop -= Math.ceil((b.top + edge - md.y)/6);
  else if(md.y > b.bottom - edge) sc.scrollTop += Math.ceil((md.y - (b.bottom - edge))/6);
  md.ghost.style.transform = `translate(${md.x - md.x0}px,${md.y - md.y0}px) scale(1.03)`;
  const el = document.elementFromPoint(md.x, md.y);
  const slot = el && el.closest(".slot[data-date]"), nav = el && el.closest("[data-act=weekPrev],[data-act=weekNext]");
  if(slot!==md.slot){ if(md.slot) md.slot.classList.remove("mdrop"); md.slot = slot; if(slot) slot.classList.add("mdrop"); }
  if(nav!==md.nav){ if(md.nav) md.nav.classList.remove("mhover"); md.nav = nav; md.navT = performance.now(); if(nav) nav.classList.add("mhover"); }
  else if(nav && performance.now() - md.navT > 700){
    ui.weekOffset += nav.dataset.act==="weekNext" ? 1 : -1;
    render(); md.nav = null; md.slot = null;
    const c = $(`.meal[data-id="${md.id}"]`); if(c) c.classList.add("msrc");
  }
  md.raf = requestAnimationFrame(mealDragTick);
}
function mealDragEnd(e, cancelled){
  if(!md) return;
  const d = md; md = null;
  clearTimeout(d.timer);
  d.tgt.removeEventListener("touchmove", mealDragMove); d.tgt.removeEventListener("touchend", mealDragUp); d.tgt.removeEventListener("touchcancel", mealDragUp);
  if(!d.on) return;
  if(e.cancelable) e.preventDefault(); // dopo il trascinamento non si apre il pasto
  cancelAnimationFrame(d.raf);
  d.ghost.remove();
  $$(".msrc").forEach(x => x.classList.remove("msrc"));
  $$(".mdrop").forEach(x => x.classList.remove("mdrop"));
  $$(".mhover").forEach(x => x.classList.remove("mhover"));
  const m = state.meals.find(x => x.id===d.id);
  if(cancelled || !d.slot || !m || !document.body.contains(d.slot)) return;
  const date = d.slot.dataset.date, slot = d.slot.dataset.slot;
  if(date===m.date && slot===m.slot) return;
  const t = T(), others = state.meals.filter(x => x.date===date && x.slot===slot);
  withUndo(others.length ? t.tMealsSwapped : t.tMealMoved(dayLong(parseIso(date)), slotLabel(slot).toLowerCase()), () => {

    m.date = date; m.slot = slot;
  });
}

/* ---- Riordino della lista: si trascina la maniglia ≡, anche tra "Da prendere" e "Per dopo" ---- */
function startDrag(grip, e){
  const row = grip.closest(".li"), sc = $("#scroller");
  const groups = $$('.lgroup[data-group="todo"], .lgroup[data-group="later"]');
  const src = row.parentElement;
  if(!groups.includes(src)) return;
  e.preventDefault();
  try{ grip.setPointerCapture(e.pointerId); }catch(err){}
  // Misure prese all'inizio: poi si tiene conto solo di quanto si è mosso il dito e di quanto è scorsa la lista.
  const info = groups.map(g => {
    const r = g.getBoundingClientRect(), rows = $$(".li", g);
    return {g, top:r.top, bottom:r.bottom, rows, centers:rows.map(x => { const b = x.getBoundingClientRect(); return b.top + b.height/2; })};
  });
  const S = info.find(x => x.g===src), from = S.rows.indexOf(row);
  const rb = row.getBoundingClientRect(), h = rb.height, c0 = rb.top + h/2, startY = e.clientY, startScroll = sc.scrollTop;
  let y = startY, target = S, to = from, raf = 0, ended = false;
  row.classList.add("dragging");
  function layout(){
    const dy = (y - startY) + (sc.scrollTop - startScroll), V = c0 + dy;
    row.style.transform = `translateY(${dy}px)`;
    // Gruppo di arrivo: quello sotto il dito, altrimenti il più vicino.
    target = info.reduce((best, G) => { const dist = V < G.top ? G.top - V : V > G.bottom ? V - G.bottom : 0; return !best || dist < best.dist ? {G, dist} : best; }, null).G;
    to = target.rows.reduce((n, r, j) => n + (r!==row && target.centers[j] < V ? 1 : 0), 0);
    for(const G of info) G.rows.forEach((r, j) => {
      if(r===row) return;
      let shift = 0;
      if(G===S && G===target) shift = from<to && j>from && j<=to ? -h : from>to && j>=to && j<from ? h : 0;
      else if(G===S) shift = j>from ? -h : 0;
      else if(G===target) shift = j>=to ? h : 0;
      r.style.transform = shift ? `translateY(${shift}px)` : "";
    });
    info.forEach(G => G.g.classList.toggle("droptarget", G===target && G!==S));
  }
  function tick(){
    if(ended) return;
    const b = sc.getBoundingClientRect(), edge = 70;
    if(y < b.top + edge) sc.scrollTop -= Math.ceil((b.top + edge - y)/6);
    else if(y > b.bottom - edge) sc.scrollTop += Math.ceil((y - (b.bottom - edge))/6);
    layout();
    raf = requestAnimationFrame(tick);
  }
  const move = ev => { y = ev.clientY; };
  const end = () => {
    ended = true; cancelAnimationFrame(raf);
    grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", end); grip.removeEventListener("pointercancel", end);
    info.forEach(G => { G.g.classList.remove("droptarget"); G.rows.forEach(r => { r.style.transform = ""; r.classList.remove("dragging"); }); });
    if(target===S && to===from) return;
    const id = row.dataset.id, it = state.list.find(i => i.id===id); if(!it) return;
    const order = {};
    info.forEach(G => { order[G.g.dataset.group] = G.rows.map(r => r.dataset.id).filter(x => x!==id); });
    order[target.g.dataset.group].splice(to, 0, id);
    it.later = target.g.dataset.group==="later";
    const byId = Object.fromEntries(state.list.map(i => [i.id, i]));
    const pick = ids => (ids || []).map(x => byId[x]).filter(Boolean);
    state.list = [...pick(order.todo), ...state.list.filter(i => i.checked), ...pick(order.later)];
    commit();
    if(target!==S) toast(it.later ? T().tMovedLater(it.name) : T().tMovedNext(it.name));
  };
  grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", end); grip.addEventListener("pointercancel", end);
  raf = requestAnimationFrame(tick);
}
document.addEventListener("pointerdown", e => { const g = e.target.closest && e.target.closest(".grip"); if(g) startDrag(g, e); });

/* ---- Prodotto ---- */
function openItem(id){
  const t = T(), it = itemById(id); if(!it) return;
  const u = used(id), [dq, du] = it.qty!=null ? toDisp(it.qty, it.unit) : [null, dispUnit(it.unit)];
  const opts = unitList().includes(du) ? unitList() : [du, ...unitList()];
  const el = sheet(`<h2>${t.editProduct}</h2>
    <label class="field"><span>${t.name}</span><input id="eName" value="${esc(it.name)}"></label>
    <div class="grid2"><label class="field"><span>${isFood(it) ? t.qty : t.qtyOpt}</span><input id="eQty" inputmode="decimal" value="${dq!=null ? qfmt(dq) : ""}"></label>
      <label class="field"><span>${t.unit}</span><select id="eUnit">${opts.map(x => `<option value="${x}" ${x===du ? "selected" : ""}>${ul(x)}</option>`).join("")}</select></label></div>
    ${u ? `<p class="hint">${t.alreadyUsed(qs(u, it.unit))}</p>` : ""}
    ${sheetButtons(t.save)}`, {form:true, blurEnter:true});
  el.onsubmit = e => {
    e.preventDefault();
    const name = cap($("#eName", el).value.trim()), q = num($("#eQty", el).value), nu = $("#eUnit", el).value;
    if(!name || (isFood(it) && !(q>0))){ toast(t.tNameQty); return; }
    const unchanged = nu===du && dq!=null && Math.abs(q - Math.round(dq*100)/100) < 0.005;
    if(!unchanged){
      if(u>0 && DIM[nu]!==DIM[it.unit]){ toast(t.cantChangeKind); return; }
      if(q>0 && q < u*F[it.unit]/F[nu] - 1e-6){ toast(t.qtyTooLow(qs(u, it.unit))); return; }
      if(u>0 && nu!==it.unit){ const k = F[it.unit]/F[nu]; state.meals.forEach(m => m.ing.forEach(g => { if(g.itemId===id) g.qty = Math.round(g.qty*k*10000)/10000; })); }
      it.qty = q>0 ? q : null; it.unit = nu;
    }
    it.name = name; blurActive(); closeSheet(); commit(); toast(t.tSaved);
  };
}

/* ---- Fine spesa: conferma, quantità mancanti, scontrino ---- */
function openEndShop(){
  const t = T(), sel = state.list.filter(i => i.checked).map(i => ({...i}));
  if(!sel.length) return;
  const missing = sel.filter(i => !(i.qty>0) && catOf(i)==="food");
  const total = missing.length + 1;
  let step = -1;
  const bar = cur => `<div class="steps">${Array.from({length:total}, (_,k) => `<i class="${k<=cur ? "on" : ""}"></i>`).join("")}</div>`;
  function show(){
    let body;
    if(step===-1){
      const plainN = sel.filter(i => catOf(i)!=="food").length;
      const where = i => catOf(i)!=="food" ? t.catL[catOf(i)] : i.qty>0 ? qs(i.qty, i.unit) : t.qtyToSet;
      body = `<div class="head"><div class="label">${t.endLabel}</div><h2>${t.endT(sel.length)}</h2></div>
        <ul class="sum">${sel.map(i => `<li>${esc(i.name)} <span class="muted num">${where(i)}</span></li>`).join("")}</ul>
        ${plainN ? `<p class="hint">${t.plainEndHint}</p>` : ""}
        ${missing.length ? `<p class="hint">${t.willAsk(missing.length)}</p>` : ""}
        ${sheetButtons(t.confirm)}`;
    } else if(step < missing.length){
      const it = missing[step];
      const pre = it.qty>0 ? {v:it.qty, u:it.unit} : it.need ? {v:roundMeal(it.need.qty, it.need.unit), u:mealUnit(it.need.unit)} : null;
      const du = (pre && pre.u) || it.unit || unitList()[0];
      body = `${bar(step)}<div class="head"><div class="label">${t.productOf(step+1, missing.length)}</div><h2>${t.howMuch(esc(it.name.toLowerCase()))}</h2></div>
        <div class="grid2"><input id="wQty" inputmode="decimal" placeholder="500" value="${pre ? qfmt(pre.v) : ""}" aria-label="${t.qty}">
          <select id="wUnit" aria-label="${t.unit}">${unitList().map(u => `<option value="${u}" ${u===du ? "selected" : ""}>${ul(u)}</option>`).join("")}</select></div>
        <div class="grid2"><button type="button" class="btn ghost" id="wBack">${t.back}</button><button class="btn" type="submit">${t.next}</button></div>`;
    } else {
      body = `${bar(total-1)}<div class="head"><div class="label">${t.lastStep}</div><h2>${t.howMuchSpent}</h2></div>
        <label class="field"><span>${t.receiptTotal}</span><input id="wAmt" inputmode="decimal" placeholder="${t.phReceipt}"></label>
        <p class="hint">${t.receiptHint}</p>
        <div class="grid2"><button type="button" class="btn ghost" id="wBack">${t.back}</button><button class="btn" type="submit">${t.toPantry}</button></div>`;
    }
    const el = sheet(body, {form:true});
    const back = $("#wBack", el); if(back) back.onclick = () => { step--; show(); };
    el.onsubmit = e => {
      e.preventDefault();
      if(step>=0 && step<missing.length){
        const v = num($("#wQty", el).value); if(!(v>0)){ toast(t.tQtyPos); return; }
        missing[step].qty = v; missing[step].unit = $("#wUnit", el).value;
      }
      if(step===missing.length){ finish(num($("#wAmt", el).value)); return; }
      step++; show();
    };
  }
  function finish(amt){
    let nFood = 0;
    for(const i of sel){
      const c = catOf(i);
      if(c==="food"){ const m = missing.find(x => x.id===i.id) || i; addToPantry(i.name, m.qty, m.unit || "pz"); nFood++; }
      else if(KEPT.includes(c)){ addKept(i.name, c); nFood++; }
    }
    const ids = new Set(sel.map(i => i.id));
    state.list = state.list.filter(i => !ids.has(i.id));
    if(amt>0) state.expenses.push({id:uid(), amount:r2(amt), date:iso(new Date()), note:t.fromList});
    blurActive(); closeSheet(); commit(); toast(t.tShopDone(nFood, amt>0 ? eur(amt) : ""));
  }
  show();
}
// Merenda e bibite: un solo prodotto per nome, senza quantità. Se c'è già si aggiorna solo la data.
function addKept(name, cat){
  const ex = state.items.find(i => catOf(i)===cat && nameScore(i.name, name)>=2), now = new Date().toISOString();
  if(ex) ex.bought = now;
  else state.items.push({id:uid(), name, qty:null, unit:"pz", cat, added:now});
}
// Alimentari: colazione, condimenti e casa restano nella lista e non entrano in dispensa.
function addToPantry(name, qty, unit){
  const ex = state.items.find(i => isFood(i) && sameName(i.name, name) && DIM[i.unit]===DIM[unit]);
  if(ex){
    ex.bought = new Date().toISOString();
    if(qty>0) ex.qty = Math.round(((ex.qty || 0) + qty*F[unit]/F[ex.unit])*1000)/1000;
  }
  else state.items.push({id:uid(), name, qty:qty>0 ? qty : null, unit, cat:"food", added:new Date().toISOString()});
}

// Il tastierino numerico dell'iPhone non ha un tasto per chiudersi: mostriamo "Fine" in alto.

const isTyping = el => el && el.matches && el.matches("input:not([type=checkbox]):not([type=date]),textarea");

// Su iPhone, dopo che la tastiera si chiude la pagina a volte resta spostata: la riportiamo a posto.
function resetViewport(){ if(!isTyping(document.activeElement) && (window.scrollY || document.documentElement.scrollTop)) window.scrollTo(0, 0); }
function placeKb(){
  const b = $(".kbdone"), vv = window.visualViewport; if(!b || !vv) return;
  b.style.top = vv.offsetTop > 0 ? (vv.offsetTop + 12) + "px" : "";
}
if(window.visualViewport){
  visualViewport.addEventListener("resize", () => { placeKb(); setTimeout(resetViewport, 80); });
  visualViewport.addEventListener("scroll", placeKb);
}

// Niente zoom: né con due dita né con il doppio tocco (il doppio tocco è già bloccato dal CSS).
["gesturestart","gesturechange","gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
document.addEventListener("touchmove", e => { if(e.touches && e.touches.length>1) e.preventDefault(); }, {passive:false});
document.addEventListener("dblclick", e => e.preventDefault(), {passive:false});

/* =========================================================
   11. AVVIO
   ========================================================= */
loadLocal();
try{ const tb = localStorage.getItem(LS_KEY+"-tab"); if(tb && VIEWS[tb] && tb!=="settings") ui.tab = tb; }catch(e){}
applyTheme();
render();
connect();
})();
</script>

<script>
// Aggiornamenti: il service worker viene controllato a ogni apertura e quando l'app torna in primo piano.
// Quando arriva una versione nuova, la pagina si ricarica una volta da sola.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  let hadController = !!navigator.serviceWorker.controller, reloaded = false, reg = null;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) { hadController = true; return; }
    if (reloaded) return;
    reloaded = true; location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
      .then(r => { reg = r; return r.update(); }).catch(() => {});
  });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && reg) reg.update().catch(() => {}); });
}
</script>
